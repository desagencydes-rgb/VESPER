##############################################################################
# PROVIDER SUPPLY -- which remote endpoints exist, and what each may SEE
#
# Authority: PROVIDER_SUPPLY.md (the egress sweep) - MULTI_ROUTE.md (the
# ladder) - INV-HW-2, INV-COST-3/5, rule R6.
#
# WHY THIS IS DATA AND NOT CODE. `routing/` decides on measured capability and
# egress class; it never branches on who the provider is. The endpoint's
# identity -- url, model, credential name -- arrives as data and is recorded in
# the evidence a call returns. A different vendor speaking the same shape is a
# row here, not a patch. That is the same discipline INV-HW-1 applies to
# hardware, applied to suppliers.
#
# WHY IT IS GOVERNED. This file decides WHAT MAY SEE THE OWNER'S PRIVATE DATA.
# The runtime may propose a change to it and may never apply one
# (INV-SELF-1..7). Adding a row is a reviewed act.
#
# RULE R6, WHICH ORDERS THE COLUMNS BELOW: egress class gates the provider
# BEFORE quota does. A large free quota never buys access to private content.
# The two most generous free tiers available are both E2_PUBLIC, so a router
# that picked on quota would pick exactly wrong.
#
# EVERY `quota_*` FIGURE HERE IS PUBLISHED, NOT MEASURED. They are written as
# `quota_published` for that reason and are loaded with `limit_is_measured =
# false`. The ledger plans against them conservatively and replaces them with
# the real ceiling the first time a provider refuses -- a refusal is a
# measurement, a docs page is not (INV-HW-2).
#
# MODEL IDS ARE PROBED, NEVER TRUSTED. MULTI_ROUTE.md SS13.2: a provider's own
# `/models` listing returned 37 entries of which most 404 on these credentials.
# `tools/spike/probe_remote_supply.py` asks each endpoint directly and a row
# that fails its probe is not registered.
##############################################################################

schema_version = 1
# TIER IS DECLARED PER ROW AND NEVER PARSED FROM THE ID. `cf-strong` appears to
# carry its own tier and reading it out of the name would be the same defect as
# deriving a model profile from its filename: an id is a label, not a
# measurement, and renaming a row would silently change what it is trusted to
# answer. The tier says WHICH DIFFICULTIES may route here; the measured rate
# says how fast it is. Both are needed and neither implies the other.
authority = "PROVIDER_SUPPLY.md - MULTI_ROUTE.md SS2 - INV-HW-2, INV-COST-5, R6"

# --------------------------------------------------------------------------
# RUNG 1 -- key-based remote. Tried first, ordered among themselves by
# REMAINING HEADROOM at request time, not by their order here.
# --------------------------------------------------------------------------

[[provider]]
id = "cf-strong"
tier = "strong"
rung = 1
purpose = "text"
# THE SAME POOL AS cf-image, and this line is the whole of MULTI_ROUTE.md SS3.
# Without it the text row keeps its own ceiling, the image row keeps another,
# and the two together authorise 20,000 neurons against a budget of 10,000.
# The acceptance run caught exactly that: the pool report listed the image row
# alone, so "one shared pool" was true of a pool with one member.
account = "cloudflare"
egress_class = "E1_PRIVATE"
cost_class = "metered_free_tier"
# INV-COST-5: metered_free_tier is treated as PAID unless a hard cap is
# provable. No card is attached and the tier cannot overspend into billing.
provable_hard_cap = true
hard_cap_evidence = "Free account, no payment method attached; the tier refuses at the ceiling rather than billing over it. Re-verify if a card is ever added."
credential_env = "CLOUDFLARE_API_TOKEN"
account_env = "CLOUDFLARE_ACCOUNT_ID"
endpoint = "https://api.cloudflare.com/client/v4/accounts/{account}/ai/run/{model}"
model = "@cf/openai/gpt-oss-120b"
wire = "cf_responses"
quota_unit = "neurons"
quota_published = 10_000
quota_window_seconds = 86_400
quota_note = """ONE POOL SHARED WITH IMAGE GENERATION. MULTI_ROUTE.md SS3: text
and image draw the same 10,000 neurons/day, so the ledger for this account is
per-ACCOUNT and never per-modality. Separate modality ledgers would each
believe they held the whole pool."""
usage_reporting = "unreliable"
usage_note = """MEASURED 2026-08-25: a call that plainly worked reported
input_tokens 0, output_tokens 0, neurons 0. Spend from this provider is booked
UNMEASURED. Do not restore trust in the field without re-measuring."""

[[provider]]
id = "groq-strong"
tier = "strong"
# OPTIONAL PARAMETERS ARE DECLARED PER ROW AND DEFAULT TO UNSUPPORTED.
# "OpenAI-compatible" describes the request SHAPE, not the parameter set, and
# assuming otherwise cost a live 400: Mistral answered `reasoning_effort is not
# enabled for this model` on every call, and the whole standard-tier private
# rung was dead while the wire format looked correct. Measured per row; absent
# means not sent.
supports = ["reasoning_effort"]
rung = 1
egress_class = "E1_PRIVATE"
cost_class = "metered_free_tier"
provable_hard_cap = true
hard_cap_evidence = "Free account, no payment method attached. E1 permission additionally requires Zero Data Retention enabled on the account -- owner confirmed 2026-08-25."
credential_env = "GROQ_API_KEY"
endpoint = "https://api.groq.com/openai/v1/chat/completions"
model = "openai/gpt-oss-120b"
wire = "openai_chat"
quota_unit = "tokens"
quota_published = 200_000
quota_window_seconds = 86_400
quota_note = """Token-bound, not request-bound: the 1,000 req/day ceiling never
binds first. Completion tokens INCLUDE reasoning tokens -- measured 57 of 64 on
a seven-character answer -- so a ledger counting output length undercounts real
spend by roughly 8x on small calls."""
usage_reporting = "reliable"

