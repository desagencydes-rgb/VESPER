# --------------------------------------------------------------------------
# RUNG 2 -- subscription-backed, reached through each vendor's OWN CLI.
#
# NOT MCP, and the distinction cost a wrong design earlier today. `claude mcp
# serve` and an MCP client are the wrong direction entirely: they expose TOOLS
# to a model, where VESPER needs an ANSWER from one. The subscriptions are
# reached by running the official CLI headless as a subprocess -- an official
# client, subscription auth, a documented programmatic surface. Not scraping,
# and not a lifted OAuth token in a third-party harness.
#
# THESE ARE RUNG 2 AND MUST NEVER BE REACHED AHEAD OF RUNG 1. A rung-1 call
# costs free quota that refills daily; a rung-2 call costs the owner's own
# 5-hour window, which they may want for themselves.
# --------------------------------------------------------------------------

[[provider]]
id = "claude-sub"
tier = "strong"
rung = 2
egress_class = "E1_PRIVATE"
cost_class = "free"
credential_env = "VESPER_CLAUDE_CONFIG_DIR"
endpoint = "claude"
wire = "cli_subprocess"
argv = ["-p", "{prompt}"]
config_dir_env = "CLAUDE_CONFIG_DIR"
config_dir = "~/.config/vesper/claude-vesper"
model = "subscription-default"
quota_unit = "requests"
quota_published = 0
quota_window_seconds = 18_000
egress_note = """E1 ONLY WITH TRAINING OFF ON THAT ACCOUNT. Owner confirmed
2026-08-25. With it on, consumer data may be retained de-identified for up to
five years in training pipelines, and the policy explicitly covers Claude Code."""
quota_note = """DEDICATED ACCOUNT, NO FAILOVER EDGE TO THE OWNER'S. Bound by
CLAUDE_CONFIG_DIR to a separate account (verified: a per-config-dir keychain
entry, so credentials are genuinely isolated). When this account is spent the
ladder falls THROUGH to the next rung and never sideways to the owner's --
failover between two accounts triggered by exhaustion is limit evasion, and it
is what enforcement targets. The owner may retrigger manually; that is a
decision, not a failover.

The window is ~5h and the ceiling is unpublished, so nothing is planned against
it. Every surface shares one pool."""

[[provider]]
