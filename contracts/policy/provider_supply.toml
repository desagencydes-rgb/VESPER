# PER-SUBSYSTEM LADDERS -- owner's allocation, 2026-08-31.
#
# WHY EACH SUBSYSTEM GETS ITS OWN ACCOUNT and not just its own row: isolation is
# per-ACCOUNT, so the updater running hot cannot starve the chooser only if they
# hold different credentials on different accounts. Two rows sharing one key
# share one quota and buy nothing.
#
# `purpose` IS THE MECHANISM AND IT ALREADY EXISTED -- rows, profile ids and
# `quota.reserve(account, purpose, fraction)` all carry it, and `image` was
# already using it. These rows add no machinery; they populate what was there.
#
# RUNG ORDER IS PER SUBSYSTEM, because what each one needs differs. The chooser
# sits inside the latency path, so the fast rung leads even though its quota is
# the smallest -- 8,000 tok/min on Groq, and MEMORY.md records probe calls alone
# rate-limiting it. The updater is high-volume background where latency is
# irrelevant, so the largest measured quota leads instead.

