toggle nor the privacy portal overrides. The owner reports both are off; the
second rests on secondary sources because OpenAI's help pages refuse automated
fetching. Fail-closed until seen: a rung's worth of capacity held back on an
unverified claim is the correct trade when the alternative is the owner's
source code in a training set."""
quota_note = """~6,400 TOKENS OF OVERHEAD PER CALL, MEASURED 2026-08-25: `codex
exec` reported 6,393 tokens used to answer nine characters. Against a
token-metered plan that overhead dominates any short request, so this rung must
take work large enough to amortise it and never trivial tasks. That is a
routing rule, not a note."""

# --------------------------------------------------------------------------
# IMAGE GENERATION -- a separate MODALITY, the SAME ACCOUNT POOL.
#
# The brief asked for image, video and music to get "their own routing
# systems". They get their own POLICY. They must share one LEDGER, and that is
# not a preference -- it falls out of the meter: text and image are billed in
# the same currency from the same 10,000/day. Two routers each holding their
# own ledger would each believe they had the whole pool and together authorise
# twice the real budget, with the overspend landing as 429s on whichever asked
# last -- most likely the interactive one, i.e. the owner.
#
# MEASURED 2026-08-25, and it corrects the plan twice over. Cloudflare reports
# `neurons: 0` for TEXT but a real figure for IMAGE: 172.8 for one 1024x1024 at
# 4 steps. MULTI_ROUTE.md SS13.5 said this provider's usage field could not be
# trusted at all; that holds for text and is false for image.
#
# And 172.8 is 3x the planning estimate of 57.6, which had multiplied the step
# cost by steps alone. The published formula is
#     tiles * 4.80  +  tiles * steps * 9.60
# -- the step cost is PER TILE per step. 1024x1024 is four tiles, so a large
# image costs 3.3 reference text answers and the day holds 58 of them.
# 512x512 is one tile at 43.2 neurons, and the day holds 231.
#
# VIDEO AND MUSIC HAVE NO ROW, deliberately. Workers AI has no category for
# either; no free video API published data terms that survive the egress sweep;
# and the open music weights need a GPU this host does not have. A modality
# with no permitted supplier registers NOTHING and fails closed, rather than
# being pointed at an unvetted endpoint.
# --------------------------------------------------------------------------

[[provider]]
id = "cf-image"
tier = "standard"
rung = 1
purpose = "image"
account = "cloudflare"
egress_class = "E1_PRIVATE"
cost_class = "metered_free_tier"
provable_hard_cap = true
hard_cap_evidence = "Same free account as cf-strong: no payment method attached, refuses at the ceiling rather than billing over it."
credential_env = "CLOUDFLARE_API_TOKEN"
account_env = "CLOUDFLARE_ACCOUNT_ID"
endpoint = "https://api.cloudflare.com/client/v4/accounts/{account}/ai/run/{model}"
model = "@cf/black-forest-labs/flux-1-schnell"
wire = "cf_image"
quota_unit = "neurons"
quota_published = 10_000
quota_window_seconds = 86_400
measured_note = """MEASURED live 2026-08-25: HTTP 200 in 1.7s, a 1024x1024 JPEG
of 265,231 bytes, and `usage.neurons = 172.8` -- which matches the published
formula exactly. This is the only row in the table whose spend is genuinely
measured from the provider's own accounting."""


