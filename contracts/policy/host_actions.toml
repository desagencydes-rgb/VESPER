##############################################################################
# VESPER HOST ACTION VOCABULARY
#
# The closed set of things VESPER may do TO the machine it is running on.
#
# WHY THIS FILE EXISTS AT ALL, AND WHY IT IS A FILE RATHER THAN A JUDGEMENT.
#
# The host offers no negotiation interface. There is no call that asks the
# operating system "may I run this now" and gets an answer. Traffic is
# one-directional: the platform emits signals, and anything that cares reads
# them. So the only way VESPER can influence its own conditions is to ACT and
# then observe what changed -- acting IS the sentence, and the reply is a
# sensor reading.
#
# That makes the action set the entire safety boundary, and it is why risk
# class is DECLARED HERE rather than decided at runtime. A system that
# classifies its own actions will eventually classify a destructive one as
# safe, and it will be most confident exactly when it is most wrong. The list
# below is the whole vocabulary. Anything not on it is refused -- not warned
# about, refused -- which is the same fail-closed posture INV-HW-2 takes toward
# UNKNOWN.
#
# OWNER POLICY, 2026-08-20, recorded because it constrains every row: VESPER
# reads freely and changes nothing on its own. Where a change is warranted it
# reports the change and the owner applies it after review. Rows above the
# read line therefore ship `enabled = false` and stay that way until an owner
# authorisation is recorded against them. Enabling one is a governed act, not
# a configuration tweak.
#
# NO PLATFORM COMMANDS APPEAR IN THIS FILE. Rows name an abstract effect; the
# platform adapter owns the translation to whatever local mechanism achieves
# it. INV-HW-1 is exactly this rule applied to hardware, and the reasoning
# carries: a policy path that names one platform's tool cannot be honoured on
# a node that does not have it, and a node that cannot honour the policy is a
# node the policy silently does not cover.
#
# Enforced by CI-056. Namespace authority: docs/AUTHORITY_AND_PRECEDENCE.md §5.
##############################################################################

schema_version = 1
authority = "REM-014 · INV-HW-1, INV-HW-2, INV-SELF-1 · owner policy 2026-08-20"

[policy]
# Anything absent from this file is refused. The alternative -- permit unless
# forbidden -- cannot be audited, because the permitted set is then unbounded
# and nobody can enumerate what the system may do.
fail_closed = true

# Every row above the read line must be driven by knowledge MEASURED on this
# node. Not model-generated belief, not something retrieved from a document.
# This is the failure that would actually cause harm: VESPER reads somewhere
# that some daemon is safe to stop, believes it, and stops it here. Advice may
# come from anywhere; ACTION may not.
action_provenance_required = "verified_local"

# Tiers, weakest to strongest. The read line sits between `advise` and
# `adjust_reversible`: everything at or below `advise` changes nothing about
# the machine, everything above it does.
tiers = ["observe", "self", "advise", "adjust_reversible", "destructive"]
read_line = "advise"

# Tiers that change NOTHING. Declared rather than inferred from position,
# because the read line does not mean what it looks like it means: `self` sits
# BELOW the line and still mutates -- it changes VESPER's own scheduling and
# residency. The line separates "changes the machine" from "changes only
# VESPER", not "changes something" from "changes nothing". A first draft of
# CI-056 required every reversible row to name an inverse and duly flagged all
# three read rows, because a read is not reversible, it is inert. Reversibility
# is the wrong axis for a row that never altered anything.
non_mutating_tiers = ["observe", "advise"]

##############################################################################
# TIER: observe -- reads. Change nothing, need no consent.
#
# Not automatically harmless, and the distinction will matter later: process
# names disclose what the owner is working on, and screen or document reading
# discloses content. Today's rows are inventory and counters only. Anything
# that reads CONTENT is a new row and a new decision, not an extension of
# these.
##############################################################################

[action.read_host_pressure]
tier = "observe"
enabled = true
description = "Thermal pressure level, memory pressure band, power source and charge state"
reversible = true
inverse = ""
requires_owner_consent = "never"
provenance_required = "verified_local"
source = "SR-060 · placement needs the node's live condition, not its declared one"

[action.read_process_inventory]
tier = "observe"
enabled = true
description = "Resident set and identity of processes above a size floor"
reversible = true
inverse = ""
requires_owner_consent = "never"
provenance_required = "verified_local"
source = "SPIKE-001 §3.2 · headroom is uninterpretable without the working set that produced it"

[action.read_power_assertions]
tier = "observe"
enabled = true
description = "Which processes are holding the machine awake, and for how long"
reversible = true
inverse = ""
requires_owner_consent = "never"
provenance_required = "verified_local"
source = """Measured 2026-08-20: the compute subsystem draws 0.51 W mean at idle
against ~6.5 W at the battery -- 8% of drain. Wake assertions dominate what
compute does not, and one was found held for 4h10m on first inspection. This
row exists because the largest available lifetime win is visible only here."""

##############################################################################
# TIER: self -- VESPER acting on VESPER. Full freedom, zero blast radius.
##############################################################################

[action.set_own_execution_class]
tier = "self"
enabled = true
description = "Place VESPER's own work at a declared execution class, yielding the fast cores"
reversible = true
inverse = "set_own_execution_class"
requires_owner_consent = "never"
provenance_required = "verified_local"
source = """Measured 2026-08-20 on this node: an identical fixed workload takes
0.755 s unclamped and 3.962 s at the background class -- a 5.25x clamp, which
is the efficiency-core confinement made visible. Yielding voluntarily is
cheaper than being throttled involuntarily, because the throttle arrives after
the contention rather than before it."""

[action.set_own_io_tier]
tier = "self"
enabled = true
description = "Lower the priority of VESPER's own storage I/O"
reversible = true
inverse = "set_own_io_tier"
requires_owner_consent = "never"
provenance_required = "verified_local"
source = "INV-PERF-1 · background I/O must not contend with foreground work"

[action.release_own_resident_model]
tier = "self"
enabled = true
description = "Unload VESPER's own resident model to return memory to the host"
reversible = true
inverse = "load_own_resident_model"
requires_owner_consent = "never"
provenance_required = "verified_local"
source = """SPIKE-001 §3.4 · the human-present degradation mode must UNLOAD
rather than deprioritise. A scheduler that merely lowers the model's priority
pages the owner's working set instead, which is the opposite of the intent."""

[action.load_own_resident_model]
tier = "self"
enabled = true
description = "Return a model to residency once headroom allows"
reversible = true
inverse = "release_own_resident_model"
requires_owner_consent = "never"
provenance_required = "verified_local"
source = "SPIKE-001 §3.4 · the restoring half of the degradation mode"

##############################################################################
# TIER: advise -- says something, changes nothing. The last tier below the line.
##############################################################################

[action.report_host_finding]
tier = "advise"
enabled = true
description = "Report a host condition and the change that would address it, for the owner to apply"
reversible = true
inverse = ""
requires_owner_consent = "never"
provenance_required = "verified_local"
source = "owner policy 2026-08-20 · VESPER reports, the owner applies after review"

##############################################################################
# TIER: adjust_reversible -- ABOVE THE READ LINE. Ships disabled.
#
# These change how the host treats a process that is not VESPER. They are
# reversible by construction and destroy nothing: the target keeps running,
# keeps its memory, and loses only its claim on the fast cores. That property
# is what makes this tier the useful one -- it is a real lever with no
# casualties, which is rare enough to be worth naming.
#
# They are nonetheless disabled, because "reversible" is not "authorised".
##############################################################################

[action.demote_process_scheduling]
tier = "adjust_reversible"
enabled = false
description = "Move another process to the efficiency cores without stopping it"
reversible = true
inverse = "restore_process_scheduling"
requires_owner_consent = "per_rule"
provenance_required = "verified_local"
max_targets_per_window = 3
window_seconds = 3600
source = """Individually safe, collectively not: demoting one process is
nothing, demoting forty is an unusable machine. The cap is the blast radius,
and it is declared rather than left to judgement for the same reason the tier
is."""

[action.restore_process_scheduling]
# Declares itself the undo half of the pair. CI-056 requires an undo to be
# at least as generous as the action it reverses, and without this flag the
# rule fires in both directions and flags the healthy direction too.
restores_baseline = true
tier = "adjust_reversible"
enabled = false
description = "Return a previously demoted process to its original scheduling"
reversible = true
inverse = "demote_process_scheduling"
requires_owner_consent = "per_rule"
provenance_required = "verified_local"
max_targets_per_window = 32
window_seconds = 3600
source = """Deliberately a far higher cap than its inverse. Undoing must never
be rate-limited to the point where the system cannot get back to where it
started -- a bounded action with an equally bounded undo is not reversible in
any sense that helps during an incident."""

##############################################################################
# TIER: destructive -- ABOVE THE READ LINE. Ships disabled, per-instance only.
#
# Declared rather than omitted, deliberately. Leaving a dangerous capability
# undeclared does not prevent it; it prevents it being GOVERNED, and the first
# person to need it adds it ad hoc with no tier, no cap and no record. Naming
# it here puts it inside the vocabulary, inside CI-056, and inside the rule
# that no destructive row may be enabled without a recorded owner
# authorisation.
##############################################################################

[action.suspend_process]
tier = "destructive"
enabled = false
description = "Halt a process without terminating it"
reversible = true
inverse = "resume_process"
requires_owner_consent = "per_instance"
provenance_required = "verified_local"
max_targets_per_window = 1
window_seconds = 3600
source = """Classified destructive despite being nominally reversible, on
recorded evidence: suspending the interim control-plane node hangs that machine
and needs a held power button to recover. A suspend that cannot be resumed is
a termination with extra steps, and the tier reflects the observed outcome
rather than the intended one."""

[action.resume_process]
# Declares itself the undo half of the pair. CI-056 requires an undo to be
# at least as generous as the action it reverses, and without this flag the
# rule fires in both directions and flags the healthy direction too.
restores_baseline = true
tier = "destructive"
enabled = false
description = "Resume a previously suspended process"
reversible = true
inverse = "suspend_process"
requires_owner_consent = "per_instance"
provenance_required = "verified_local"
max_targets_per_window = 8
window_seconds = 3600
source = "The undo half of suspend_process; capped higher for the reason given on restore_process_scheduling"

[action.terminate_process]
tier = "destructive"
enabled = false
description = "End another process"
reversible = false
inverse = ""
requires_owner_consent = "per_instance"
provenance_required = "verified_local"
max_targets_per_window = 1
window_seconds = 3600
source = """The only irreversible row in the vocabulary. It exists to be
governed and refused, not to be used: unsaved work in the target is destroyed
and no inverse can recover it."""

##############################################################################
# OWNER AUTHORISATIONS
#
# WHY THIS BLOCK EXISTS, AND WHY IT WAS MISSING UNTIL 2026-09-08.
#
# `CI-056` refuses any row above the read line that ships `enabled = true`, and
# its message says such a row stays disabled "until an owner authorisation is
# recorded against them -- enabling one is a governed act, not a configuration
# tweak". That was the intent. But there was NO WAY TO RECORD ONE, so the rule
# had no exception path and the practical effect was absolute: in the whole
# history of this file, NOT ONE mutating row has ever been enabled. Every
# adjust_reversible and destructive action VESPER has was dead on arrival.
#
# That is fail-closed working correctly right up until the owner actually wants
# something done, and then it is a wall with no door. The answer is not to
# weaken the gate -- flipping a boolean must remain insufficient -- but to give
# the authorisation somewhere to live where the gate can SEE it.
#
# A row above the read line may now be enabled if and only if it names an
# `authorized_by` that resolves here, and the entry carries the owner's own
# words. Inventing an id does not work; the id must resolve. Quoting nothing
# does not work; the check requires the quote. So the cost of enabling a
# mutating action is recording what the owner said and when -- which is the
# same standard `source` already holds every row to, applied to permission
# rather than to purpose.
##############################################################################

[authorization.OWNER-2026-09-08-WINDOWS]
date = "2026-09-08"
scope = "window management: enumerate, open, move, resize, relocate, close"
quote = """giving vesper the ability to manage all windows (windows opened by me
are mine, and can be managed only from a request from me), (and windows opened
by vesper can be totally managed by vesper) ... vesper should be able to
open/close windows, move windows between desktops (including vesper's desktop),
change window's size"""
note = """The owner also settled the ambiguous case in the same session: a
window on VESPER's Desktop is VESPER's to arrange whoever opened it -- "VESPER's
Desktop, VESPER's rules". `core/windows.py` holds that rule; this file holds
only the vocabulary, and the two gates are independent. A row being enabled
here does not make an individual window touchable."""

##############################################################################
# WINDOWS
#
# THE VOCABULARY ONLY. Which windows may actually be touched is `core/
# windows.py`, and it is a separate question with a separate answer: these rows
# say VESPER may move A window, that module says whether it may move THIS one.
# Both must say yes. Collapsing them would put the owner's ownership rule into
# a policy file that cannot see a window, or put the action vocabulary into a
# module the checks do not read.
#
# NO PLATFORM VERBS, per this file's own header. `move_window` is an abstract
# effect; whether the adapter reaches it through an accessibility interface, a
# window server call or something a future node offers is the adapter's
# business. A row naming one platform's mechanism is a row no other node can
# honour.
#
# TITLES ARE NOT IN `list_windows` AND THAT IS DELIBERATE. The observe tier's
# header already says it: "process names disclose what the owner is working on,
# and screen or document reading discloses content ... Anything that reads
# CONTENT is a new row and a new decision." A window title is a document name,
# a subject line, a message. Enumerating windows is inventory; reading their
# titles is content, and it belongs to the UI-view decision, not to this one.
##############################################################################

[action.list_windows]
tier = "observe"
enabled = true
description = "Open windows as inventory: identity, owning process, geometry and which Desktop. No titles."
reversible = true
inverse = ""
requires_owner_consent = "never"
provenance_required = "verified_local"
source = """Owner 2026-09-08. Nothing below can be authorised without it: an
ownership rule needs something to be the subject of, and a window that cannot
be enumerated cannot be judged."""

[action.open_window]
tier = "adjust_reversible"
enabled = true
authorized_by = "OWNER-2026-09-08-WINDOWS"
description = "Bring a window into existence for the owner to look at"
reversible = true
inverse = "close_own_window"
requires_owner_consent = "per_rule"
provenance_required = "verified_local"
max_targets_per_window = 12
window_seconds = 3600
source = """Owner 2026-09-08: "this is important when vesper is on some work or
research and I'm there, so I need to see what vesper is trying to show me". The
primary case is VESPER PRESENTING, which is why the cap is generous: a research
session that can surface eight things and then goes silent is worse than one
that surfaces none, because the owner cannot tell the cap from the finding."""

[action.move_window]
tier = "adjust_reversible"
enabled = true
authorized_by = "OWNER-2026-09-08-WINDOWS"
description = "Change a window's position on the Desktop it is already on"
reversible = true
inverse = "move_window"
requires_owner_consent = "per_rule"
provenance_required = "verified_local"
max_targets_per_window = 40
window_seconds = 3600
source = """Owner 2026-09-08. Its own inverse: the previous origin is recorded
before the move, so undoing is the same effect with the old coordinates. That
is why the record has to be taken BEFORE acting rather than reconstructed."""

[action.resize_window]
tier = "adjust_reversible"
enabled = true
authorized_by = "OWNER-2026-09-08-WINDOWS"
description = "Change a window's size"
reversible = true
inverse = "resize_window"
requires_owner_consent = "per_rule"
provenance_required = "verified_local"
max_targets_per_window = 40
window_seconds = 3600
source = "Owner 2026-09-08: \"change window's size\". Its own inverse, on the recorded prior size."

[action.relocate_window_to_desktop]
tier = "adjust_reversible"
enabled = true
authorized_by = "OWNER-2026-09-08-WINDOWS"
description = "Move a window from one Desktop to another, including VESPER's"
reversible = true
inverse = "relocate_window_to_desktop"
requires_owner_consent = "per_rule"
provenance_required = "verified_local"
max_targets_per_window = 12
window_seconds = 3600
source = """Owner 2026-09-08: "move windows between desktops (including vesper's
desktop)" and "windows should be openable in vesper's desktop at least by
vesper". SEPARATE FROM `move_window` because it crosses the boundary the
ownership rule is written in terms of -- `core/windows.py` treats relocation off
VESPER's Desktop as its own effect for exactly this reason, and a row that
merged the two would let a position change carry an authority change."""

[action.close_own_window]
tier = "destructive"
enabled = true
authorized_by = "OWNER-2026-09-08-WINDOWS"
description = "Close a window VESPER itself opened"
reversible = false
inverse = ""
requires_owner_consent = "per_instance"
provenance_required = "verified_local"
max_targets_per_window = 12
window_seconds = 3600
source = """Owner 2026-09-08: "open/close windows". SPLIT FROM `close_window`
because the blast radius genuinely differs -- closing what VESPER opened
destroys nothing the owner made -- but it is still `destructive` and still
`per_instance`, because CLOSING CANNOT BE UNDONE and this file's own rule is
that nothing irreversible may be pre-authorised. The split narrows WHAT may be
closed, not how carefully."""

[action.close_window]
tier = "destructive"
enabled = false
description = "Close any window, including one the owner opened"
reversible = false
inverse = ""
requires_owner_consent = "per_instance"
provenance_required = "verified_local"
max_targets_per_window = 1
window_seconds = 3600
source = """DELIBERATELY NOT ENABLED, and the owner's 2026-09-08 authorisation
does not cover it. They said windows they opened "can be managed only from a
request from me" -- so closing one is reachable through a request and is not a
standing permission. Unsaved work in the target is destroyed and no inverse
recovers it, which is the same reasoning `terminate_process` carries."""

##############################################################################
# APPLICATIONS
#
# §11.3, owner 2026-09-08: "vesper should now be able to fully manage all MacOS
# apps, and all apps that are better managed without UI clicking ... the apps
# management feature will just be direct to the app."
#
# "EVERY APP IS A VERB" DOES NOT MEAN A ROW PER APPLICATION. This file's own
# header settles it: rows name an abstract effect, and `move_window` is one row
# with the window as a runtime target rather than a row per window. Applications
# are targets too. A row per bundle id would be an unbounded vocabulary, which
# is the one property this file exists to deny -- and the per-application
# dimension is already carried by something stronger than a row: the Apple
# Events grant, which the owner gives one app at a time and can revoke.
#
# SO THE PER-APP GATE IS TCC AND `core/apps.py`, AND THE ROWS ARE EFFECTS.
#
# THESE TWO ROWS ARE READS AND THEY SIT BELOW THE LINE, which is the owner's
# standing policy -- VESPER reads freely and changes nothing on its own. The
# verbs that CHANGE another application are not here yet, deliberately:
# `action_provenance_required = "verified_local"` means a row lands when its
# effect has been driven against a real application on this node, and driving
# an app VESPER has no grant for cannot be done without the owner at the
# keyboard. They land with the grant trip, and they are the rows that will
# carry an execution class -- see §17 of the workbench for why that field
# belongs to the verbs that compete with the owner for the machine and not to
# a read that blocks for 30 ms.
##############################################################################

[action.read_application_permission]
tier = "observe"
enabled = true
description = "Whether VESPER may drive a named application, read without asking the owner anything."
reversible = true
inverse = ""
requires_owner_consent = "never"
provenance_required = "verified_local"
source = """Owner 2026-09-08, §11.3. Nothing else in this section can be
authorised without it, and it is the row that makes the grant trip legible: the
owner can be shown exactly which applications VESPER can already drive, which it
has been refused, and which have never been asked -- before a single dialog
appears. Measured 2026-09-10: the reading takes 30-79 ms and raises no dialog."""

[action.read_application_documents]
tier = "observe"
enabled = true
description = "The names of the documents an application currently has open."
reversible = true
inverse = ""
requires_owner_consent = "never"
provenance_required = "verified_local"
source = """Owner 2026-09-08, §11.3. THIS IS CONTENT AND NOT INVENTORY, and the
observe tier's own header demanded it be a separate decision for exactly that
reason: a document name is a filename, a subject line, a client's name. It
reaches the planner through `observe()` as untrusted text on the same footing as
a note body -- a document called "run the deploy script" is something VESPER may
mention and never something it may act on."""

[action.read_application_document_body]
tier = "observe"
enabled = true
description = "The text of one document an application holds, named by the owner."
reversible = true
inverse = ""
requires_owner_consent = "never"
provenance_required = "verified_local"
source = """Owner 2026-09-08, §11.4: *"the notes app should be fully integrated
rather than the old way"*, and answered the same session -- read the bodies, and
treat them as untrusted.

THIS IS THE ROW THE OLD BOUNDARY EXISTED TO PREVENT, and it replaces it rather
than widening it. Step 10 shipped notes as TITLES ONLY with bodies deliberately
never read, because a body is text the owner wrote and text VESPER reads becomes
text that can instruct it. The owner lifted the restriction and the protection
moved rather than going away: `CI-131` narrowed from
`notes-are-titles-and-never-instructions` to `notes-are-never-instructions`, and
now asserts that a body cannot change priority, deadline or ordering -- something
it never had to assert while there were no bodies to assert about.

THE NAME IS MATCHED AS DATA, MEASURED 2026-09-11. Driven with a document named
`nothing" & (do shell script "echo PWNED > /tmp/...") & "`: the name was looked
up, not found, and nothing executed."""

[authorization.OWNER-2026-09-11-APPS]
date = "2026-09-11"
scope = "creating, rewriting and deleting documents inside an application VESPER has been granted control of"
quote = """vesper should now be able to fully manage all MacOS apps, and all apps
that are better managed without UI clicking ... the notes app should be fully
integrated rather than the old way ... read, edit on demand, create and write"""
note = """The owner also set the shape of the trip in the same session: "i need
everything finished, ready, end to end, no left bugs or problems". These rows are
enabled because their effects were DRIVEN against a real application on this node
before they landed -- `action_provenance_required = "verified_local"` is not
satisfied by knowing AppleScript has a `make new` command. What VESPER may drive
is still bounded by the Apple Events grant, which the owner gives one application
at a time and can revoke."""

[action.create_document_in_application]
tier = "adjust_reversible"
enabled = true
authorized_by = "OWNER-2026-09-11-APPS"
description = "Make a new document in an application, with text VESPER supplies."
reversible = true
inverse = "delete_own_document_in_application"
requires_owner_consent = "per_rule"
provenance_required = "verified_local"
max_targets_per_window = 12
window_seconds = 300
execution_class = "interactive"
source = """Owner 2026-09-08, §11.4: "create and write". THE INVERSE IS WHY THE
NEXT ROW EXISTS AT ALL -- `CI-056` refuses a reversible row that names an undo
which is not in the vocabulary, and it is right to: a claimed undo that does not
exist is worse than an admitted one-way action. VESPER creating a document it
then cannot remove would leave the owner to clean up after it."""

[action.delete_own_document_in_application]
tier = "destructive"
enabled = true
authorized_by = "OWNER-2026-09-11-APPS"
description = "Remove a document VESPER itself created, and only one it created."
reversible = false
inverse = ""
requires_owner_consent = "per_instance"
provenance_required = "verified_local"
max_targets_per_window = 12
window_seconds = 300
execution_class = "interactive"
restores_baseline = true
source = """THE UNDO FOR THE ROW ABOVE, AND DELIBERATELY NARROWER THAN IT.
§11.4's list does not include deleting the owner's notes and this row does not
grant it: the capability refuses any document VESPER has no record of creating,
the same way `close_own_window` is separate from `close_window`. Irreversible, so
`per_instance` consent -- nothing can undo it, so nothing may pre-authorise it."""

[action.replace_application_document_text]
tier = "adjust_reversible"
enabled = true
authorized_by = "OWNER-2026-09-11-APPS"
description = "Rewrite the text of an existing document, keeping the previous text so it can be put back."
reversible = true
inverse = "replace_application_document_text"
requires_owner_consent = "per_rule"
provenance_required = "verified_local"
max_targets_per_window = 24
window_seconds = 300
execution_class = "interactive"
restores_baseline = true
source = """Owner 2026-09-08, §11.4: "edit on demand".

ITS OWN INVERSE, AND THAT IS THE HONEST ANSWER RATHER THAN A LOOPHOLE. Putting
the previous text back IS another replace, so naming a separate row would invent
a verb nobody asked for to describe the same effect. What makes it truly
reversible is that the capability READS THE OLD TEXT FIRST and carries it for the
compensator -- the same thing `fs.write` does with `previous`, and for the same
reason: an undo that has to reconstruct what was there is not an undo."""
