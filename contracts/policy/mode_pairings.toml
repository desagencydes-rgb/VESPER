# NAMED PAIRINGS — the owner's decision, 2026-09-08.
#
# HOME-ARCHITECTURE §6 is emphatic that the two axes must not be conflated,
# because an interface that rearranges itself while you are reading is the
# single most common way an ambient interface becomes unusable. So they stay
# independent underneath, and a PAIRING is an entry point rather than a weld:
# picking one sets both, and VESPER may still move along the ambience axis on
# its own afterwards -- Thinking, Speaking, Alert -- without the stage moving.
#
#   axis A, AMBIENCE: what VESPER is doing. Eleven, in docs/design/source/modes.json.
#   axis B, STAGE:    what the OWNER is doing, and what windows that work may open.
#
# A stage names the windows its work legitimately needs (HOME-WORKBENCH §11.2a).
# It grants no authority: every window is still `window.open` under the
# ownership rule and the level ladder. What it supplies is the REASON a step
# has, which INV-TRIG-1 already requires and the window log already records.

schema_version = 1

[stages.idle]
description = "Nothing asked. VESPER is present and doing nothing."
may_open = []

[stages.research]
description = "Finding something out and showing the sources."
may_open = ["browser"]

[stages.work]
description = "Doing a task while the owner watches."
may_open = ["editor", "terminal", "browser"]

[stages.explain]
description = "Answering with something on screen."
may_open = ["viewer"]
closes_when_done = true

[stages.show]
description = "Putting one artefact in front of the owner."
may_open = ["viewer"]
max_windows = 1
# THE OWNER KEEPS THIS ONE. Everything else a stage opens is vesper's to close;
# what the owner asked to be shown is theirs, and closing it would be taking
# away the thing they asked for.
owner_keeps = true

# ---------------------------------------------------------------- pairings
#
# `ambience` MUST name one of the eleven in modes.json. `stage` must name one
# above. A pairing that names something absent is refused rather than
# approximated -- the same fail-closed posture host_actions.toml takes.

[pairings.idle]
stage = "idle"
ambience = "Idle"

[pairings.research]
stage = "research"
# THE OWNER, 2026-09-10: *"this is work wallpaper not research"*. `research` and
# `work` both paired to `Working`, so asking for research changed the stage and
# left the room identical -- a mode that announced itself and looked like the
# one before it. `Milestone` is the eleventh ambience and had no pairing reaching
# it, so it was authored, shipped, and unreachable from anything the owner could
# say.
ambience = "Milestone"

[pairings.work]
stage = "work"
ambience = "Working"

[pairings.explain]
stage = "explain"
ambience = "Speaking"

[pairings.show]
stage = "show"
ambience = "Home"

[pairings.rest]
stage = "idle"
ambience = "Rest"

# ---------------------------------------------------------------- window kinds
#
# WHAT A STAGE'S `may_open` NAMES. A stage says it may open a "browser"; this is
# what makes that word decidable about a real application. Kept in the contract
# rather than in `core/` for the reason the pairings are: which application
# counts as a browser is POLICY, and policy here can be read and changed without
# a rebuild.
#
# MATCHED AGAINST THE LABEL THE OWNER USED **AND** THE RESOLVED BUNDLE ID, both
# lowercased, as a substring. The bundle id is the durable half -- an owner may
# say "safari" or "Safari.app" or "the browser" -- and `_bundle_for` has already
# turned the label into an identifier by the time this is consulted.
#
# AN APPLICATION IN NO LIST HAS NO KIND, AND THAT IS NOT A GAP. Under a stage
# with a `may_open` list, an unclassifiable application is REFUSED rather than
# allowed, which is the same fail-closed posture `stages()` takes for an unknown
# stage ("the empty list is the safe answer"). The refusal names the application
# and this table, so the fix is one line here rather than an argument with the
# machine.
#
# AND IT ONLY EVER BINDS VESPER ACTING ON ITS OWN. An explicit request from the
# owner lifts it, exactly as it lifts the empty-Desktop guard in `window_open`:
# a stage supplies the REASON an unprompted step has, it does not overrule the
# person asking.

[window_kinds]
browser  = ["safari", "chrome", "firefox", "arc", "brave", "edge", "opera",
            "com.apple.safari", "com.google.chrome", "org.mozilla"]
editor   = ["textedit", "code", "vscode", "sublime", "nova", "zed", "xcode",
            "com.apple.textedit", "com.microsoft.vscode", "com.apple.dt.xcode"]
terminal = ["terminal", "iterm", "warp", "ghostty", "alacritty", "kitty",
            "com.apple.terminal", "com.googlecode.iterm2"]
viewer   = ["preview", "quicklook", "quick look", "books", "pdf",
            "com.apple.preview", "com.apple.quicklookui"]
notes    = ["notes", "com.apple.notes"]
