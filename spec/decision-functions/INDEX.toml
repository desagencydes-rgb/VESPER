output = "LOCAL | REMOTE(provider_id) | REFUSE(reason)"
model_access = false
enforces = ["INV-EVID-1", "INV-COST-3", "INV-PRIV-1"]

[decision_functions.DF-PRESENT-BIND]
title = "Artifact presentation binding -- scene, document, or neither"
owner_rem = "REM-009"
inputs = ["artifact_kind", "media_type", "endpoint_capability", "scene_available"]
output = "SEMANTIC_SCENE(scene_ref) | DOCUMENT_REF | NOT_PRESENTABLE"
model_access = false
enforces = ["INV-SCENE-3", "INV-SCENE-2"]

[decision_functions.DF-PERSONA]
title = "Expressive register selection under truth precedence"
owner_rem = "REM-009"
inputs = ["situational_state", "scene_urgency", "persons_present", "claim_confidence", "boundary_asserted"]
output = "register_id + downgrade_reason | NONE"
model_access = false
enforces = ["INV-EVID-1", "INV-EVID-3"]

[decision_functions.DF-SECURITY-TRIAGE]
title = "Security signal triage: anomaly, indicator, incident"
owner_rem = "REM-011"
inputs = ["observation", "asset_enrolled", "signature_match", "confirmed_effect", "baseline"]
output = "ANOMALY | INDICATOR | INCIDENT | UNKNOWN | REFUSE_UNENROLLED"
model_access = false
enforces = ["INV-TRUST-1", "INV-EVID-1"]
