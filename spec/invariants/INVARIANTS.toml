[invariants.INV-COST-8]
statement = "One request spends a bounded total number of provider attempts across the whole chain, not a per-provider allowance multiplied by the ladder length. Provider order within a routed profile is decided by measured remaining quota, never by registration order. A refusal carrying a quota limit of zero is terminal, consumes no attempt budget, and is never offered again."
owner_rem = "REM-006"
enforced_by = ["CI-059"]
kind = "runtime"
measurement = "2026-08-25, first live calls. A 429 carrying `limit: 0` means the tier never had an allowance, so the refusal is permanent while the status is identical to a temporary one; `rate_limited` is TRANSIENT and stays TRANSIENT, because the distinction is not in the status code. Captured verbatim in tests/fixtures/provider-responses/google-429-limit-zero.json."

[invariants.INV-COST-9]
statement = "The gateway derives reasoning effort and the token budget from the routed difficulty's floor. A caller may raise effort and may never lower it; the attempt is refused rather than clamped. A response carrying empty content is a failed attempt, retried with a larger budget, and never returned as an answer."
owner_rem = "REM-006"
enforced_by = ["CI-060"]
kind = "runtime"
measurement = "2026-08-25. Same prompt, same answer `OK`: reasoning_effort low cost 26 completion tokens, medium 34, provider default 64, high 119 -- 4.6x for an identical answer, with the default near the top. And at max_tokens=16 the same endpoint returned HTTP 200, finish_reason `length` and content `''`, captured in tests/fixtures/provider-responses/groq-200-empty-content.json."
separation_note = "The floor is deliberately NOT the gateway's to lower. Budget pressure may change routing and may never change standards: a system that feels the pressure and can relax its own quality floor gets dumber exactly where sharpness matters, and every step of it looks locally justified. core/effort.py raises rather than clamps for the same reason."
[invariants.INV-NARRATE-1]
statement = "Every failure classification the gateway can produce has a narration line, rendered from a governed template and never produced by a model. A line whose required fields are absent is refused, never rendered with a gap. Speech is gated by the interruption class: a failure the owner is waiting on is spoken, an unattended one is recorded and not spoken."
owner_rem = "REM-007"
enforced_by = ["CI-061"]
kind = "runtime"
why_not_generated = "Three structural reasons, none aesthetic. The component that has failed IS the model layer, so narrating through it is a dependency loop that breaks precisely when it is needed. A generated sentence cannot be asserted on, where a template renders identically every time and a check can compare the exact string. And a spoken status line that became a provider call would spend quota to explain that quota is spent."
why_gated = "SR-004 and RB-006 point in opposite directions and both stand unmodified. Narrating ten retries of a 3 a.m. autonomous run satisfies the letter of SR-004 and violates proportionality; saying nothing while the owner waits satisfies RB-006 by deleting SR-004. interruption_budget.toml's lattice arbitrates, and core/narration.py asks it rather than re-deciding it."
measurement = "2026-08-25. The loader refused to start on its first run: `revoked` is in the gateway's TERMINAL set and had no line, which would have surfaced as silence at the exact moment the owner was waiting to be told something."

[invariants.INV-TRIAGE-1]
statement = "A quota failure is classified, routed around and never queued for investigation. Every other failure is recorded during the outage and graded afterwards, from stored attempt records rather than a summary. Only a CRITICAL_NOW grade is acted on without the owner; when no autonomous action applies, the escalation names what was already attempted, the exact remaining steps, and the command that confirms the fix."
owner_rem = "REM-006"
enforced_by = ["CI-062"]
kind = "runtime"
why_quota_is_excluded = "A rate limit or a spent window is a working provider doing its job. There is nothing to find and no action a person could take, so queueing it produces a backlog whose only possible resolution is `yes, we used what we had` -- and a queue that fills with non-findings is a queue nobody opens, taking the real findings down with it. limit==0 is excluded for a different reason: it is permanent, but the ledger has already recorded it and the ladder has already stopped offering that rung, so the system has fully absorbed the fact. It is a configuration truth for the daily summary, not an incident."
why_unknown_is_admitted = "Fail-OPEN, against this corpus's usual direction, and deliberately. A classification with no grading rule is precisely what a person should look at; the cost of admitting it is one queue entry, and the cost of declining it is a new failure mode discarded silently forever."
why_grading_is_not_a_model_call = "The rule is written down so it can be argued with, tested, and re-derived from the same attempts six months later. A model asked to grade its own provider failures produces a plausible answer nobody can check, and the one thing this queue exists to produce is findings that survive review."

[invariants.INV-COST-10]
statement = "Entries billed from one provider account draw one budget. A modality may spend the pool minus every other purpose's reserved floor, whether or not those purposes have spent anything. Floors summing past the pool make every purpose unspendable rather than overselling it."
owner_rem = "REM-006"
enforced_by = ["CI-063"]
kind = "runtime"
why_one_ledger = "The brief asked for image, video and music to get their own routing systems. They get their own POLICY; they cannot have their own LEDGER, and that falls out of the meter rather than from preference. Cloudflare bills text and image in the same currency from the same 10,000 neurons/day, so two routers each holding a ledger would each believe they had the whole pool and together authorise twice the real budget -- with the overspend landing as 429s on whichever asked last, most likely the interactive one."
why_the_floor_is_hard = "An earlier docstring called the floor soft and said an unused share was lent out. The code never did that and could not: lending works only if the lender can call the loan back, and SPENT QUOTA CANNOT BE RECLAIMED. No layer returns neurons to conversation after a batch has spent them. So a floor idles capacity on a quiet day, which is the correct trade -- the cost of the reservation is a batch finishing later, and the cost of not having one is the owner asking a question at 6 p.m. and being told the day is gone."
measurement = "2026-08-25. Cloudflare reports `neurons: 0` for TEXT and a real figure for IMAGE: 172.8 on one 1024x1024 at 4 steps, matching the published formula tiles*4.80 + tiles*steps*9.60. That is 3x the planning estimate of 57.6, which had multiplied the step cost by steps alone rather than by tiles*steps. One large image costs 3.3 reference text answers; the day holds 58 of them, or 231 at 512x512."

[invariants.INV-INTAKE-1]
statement = "Every utterance carries its source, whether it is final, and its confidence, whatever channel it arrived on. A non-final utterance is never acted on. An utterance below the confidence floor is reflected back for confirmation and is still shown; it never reaches the dispatcher. Nothing downstream branches on the source."
owner_rem = "REM-007"
enforced_by = ["CI-064"]
kind = "runtime"
why_before_there_is_a_microphone = "The owner's constraint, 2026-08-25: a text field is necessary now and matters less once VESPER holds a spoken conversation. That says which modality is PRIMARY, not which to build first -- and the expensive mistake is building the typed path as though typing were the only way anything arrives. A typed utterance is certain and complete; a spoken one arrives in fragments each revising the last, every word carrying a confidence that may be low. A pipe assuming certainty bakes that assumption into every caller downstream, and voice then arrives as a rewrite rather than a source."
why_confidence_gates_action_only = "`delete the archive` and `delete the archives` are one phoneme apart, and a recogniser 61% sure is not evidence of anything. But an uncertain utterance that is DROPPED leaves the owner unable to tell `did not hear` from `heard and declined`. So it is recorded and shown, and only the dispatch is withheld: correcting a wrong transcription costs seconds, acting on one costs whatever the action costs."
unmeasured = "CONFIDENCE_FLOOR = 0.75 is UNMEASURED and marked as such in the source. Nothing has measured a recogniser on this owner's voice in this room, and a threshold taken from a paper is a declared number. The SHAPE is right; the value is not yet a finding and must not be quoted as one."

[invariants.INV-HOME-6]
statement = "The home's markup is present, every substitution token it uses is replaced by the chrome, the chrome substitutes no token the markup lacks, and the inline fallback carries the same token set as the file. The stylesheet, the card and the main-menu row are present."
owner_rem = "REM-009"
enforced_by = ["CI-065"]
kind = "structural"
why_it_needs_an_offline_guard = "Every other layer in the tree is covered by checks that run without credentials; the chrome was covered by nothing, and its failure mode is the worst available. A malformed template ships, the webview mounts, and NOTHING PAINTS -- while `mounted` stays true, which HomeChrome's own header warns about in as many words. A layer sitting over the owner's whole Desktop cannot be verified only by someone looking at it."
why_the_fallback_is_checked_too = "The binary carries an inline copy so a missing file never blanks the Desktop, and a fallback is by definition the copy nobody looks at. It and the file can diverge for months, and the divergence surfaces on the day the file is gone -- which is to say in front of the owner, during the exact failure the fallback was written for."
why_an_unsubstituted_token_is_dangerous = "It renders literally into a CSS declaration, and an invalid declaration is DROPPED SILENTLY by the parser. The surface still appears; it is merely wrong -- a card with no solved fill over a bright wallpaper, with ink that no longer meets its contrast requirement. Present-but-wrong is harder to notice than absent."

[invariants.INV-PRIV-7]
statement = "No credential-shaped material crosses any boundary off this machine, whatever the provider's egress class. Detection is deterministic, runs at the choke point before any model sees the text, and is never itself performed by a model."
owner_rem = "OWNER-DECISION-2026-08-31"
enforced_by = ["CI-084"]
kind = "runtime"
why_it_was_missing = """No invariant in the corpus said a credential may not reach a provider, and the handwritten source never mentions credentials at all -- so the guard was built, wired at the choke point and gated, while formally enforcing nothing. It was left deliberately unregistered rather than attached to an invented rule, because a check declaring an invariant that does not exist is the manufactured claim CI-041 refuses."""
discriminator = """INV-PRIV-6 is the nearest rule and a DIFFERENT guard at the same point: it matches a provider's egress class against the content's privacy class. This one removes credentials REGARDLESS of both, because an E1_PRIVATE provider must not receive a key either.

A MODEL MAY NOT PERFORM THE DETECTION, and not as a first pass NOR as a second. Asking a model whether text contains a secret transmits the text; the request is made and the provider's log holds it whatever the answer. A second pass adds value only by catching what the deterministic pass missed, and catching it means transmitting it -- so it leaks exactly what it exists to find. The only coherent model pass is over already-redacted text checking for OVER-redaction, which sees no secrets by construction and is not detection."""

[invariants.INV-PRIV-6]
statement = "Every model call declares the privacy class of its content, and the gateway refuses any provider whose egress class may not carry it. The check runs at the choke point, per provider, immediately before invocation, and BEFORE the cost check. Unlabelled content is private. An unrecognised class raises rather than resolving to a permissive reading. A provider registered without an egress class is private-only."
owner_rem = "REM-006"
enforced_by = ["CI-066"]
kind = "runtime"
why_it_was_missing = "Two correct vocabularies had never been introduced. core/privacy.py has classified content as {public, personal, private} since A-010; contracts/policy/provider_supply.toml classifies suppliers as {E1_PRIVATE, E2_PUBLIC}. The egress class was applied ONCE at registration, deciding which ladder got built, and said nothing about what could then be sent down it. A caller registering a public ladder could send private content through it and no rule anywhere would object. Recorded as an open gap in PROVIDER_SUPPLY.md SS8 and MULTI_ROUTE.md SS12 while the entire ladder was built on top of it."
why_before_the_cost_check = "Cost decides whether VESPER may SPEND on a provider; egress decides whether that provider may SEE this content. A refusal on price that happens to preempt a privacy violation is luck, and a rule that depends on another rule failing first is not enforced. Ordering it first also keeps the recorded reason the real reason."
why_unlabelled_is_private = "core/privacy.py's asymmetry, applied to egress rather than to displays: withholding something the owner wanted costs a re-ask, and sending private content to a provider that trains on it cannot be undone. So the ambiguous case resolves to the cheap failure, and UNKNOWN is treated as the strict class rather than as a missing input to be guessed at."

[invariants.INV-HOME-7]
statement = "VESPER's face reports what VESPER is doing. Each activity signal maps to a distinct behaviour derived from events rather than set by a caller; a behaviour with no further event falls back to rest; an expression nothing measures cannot be selected; and the snapshot the chrome reads is merged, never rewritten whole."
owner_rem = "REM-009"
enforced_by = ["CI-067"]
kind = "runtime"
why_it_was_disconnected = "Behaviour.swift has carried fourteen behaviours -- distinct gaze, blink, breath, dispersal -- since the island was written, and the only thing that ever selected one was `--demo`, cycling them on a timer so they could be seen. So a face able to express thinking, listening and talking rested through every call VESPER made. Built-and-unreached is this tree's recurring failure: Provider.profile_id sat unread for months, and the egress class was applied at registration and never at the choke point. Each was correct and each had no seam to the thing it was about."
why_derived_not_set = "A `set_thinking()` method would put the face's honesty in the hands of whoever remembered to call it, and the first forgotten call is a face reporting work that is not happening. Subscribing means the face cannot claim activity it did not have, and cannot fail to show activity it did."
why_stale_falls_back = "The face is an instrument and its reading is about VESPER. `resting` while a request is in flight is a false reading in exactly the way a stale metric is -- and a face stuck on `thinking` after a crash is worse than one at rest, because it reports work that is not occurring and nothing else would correct it."
why_unmeasured_expressions_are_refused = "Five of the fourteen -- laughing, joking, angry, happy, aura -- are expressive states nothing currently measures. Selecting one from a heuristic would be the face inventing a mood. They stay unreachable until something can honestly produce them."

# ------------------------------------------------- REM-007 triggers
[invariants.INV-TRIG-1]
statement = "Every autonomous action traces to exactly one registered trigger_id whose predicate demonstrably evaluated true against a reconstructible world-model snapshot."
owner_rem = "REM-007"
enforced_by = ["CI-025", "A-011", "A-029"]
kind = "runtime"

