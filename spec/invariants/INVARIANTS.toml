##############################################################################
# VESPER INVARIANT REGISTRY
#
# An invariant is a property that must hold at all times, is stated in a form
# that can FAIL, and names the artifact that detects its violation.
#
# Every invariant declares:
#   statement  what must hold
#   owner_rem  the remediation spec that defines it (single source of truth)
#   enforced_by  CI check id(s) and/or acceptance test id(s)
#   kind       structural | runtime | process
#
# A statement with no `enforced_by` is not an invariant; it is a wish, and
# `tools/ci/checks.py ci-registry` (CI-041) fails on it.
#
# NOTE 2026-08-12: this header previously named an `invariant_lint` tool that
# was never written. CI-041 has always been implemented by the ci-registry
# check above. Corrected after the reference-integrity lint (CI-050) found the
# dangling citation -- a registry naming a non-existent enforcer is the same
# defect class as an invariant with an empty enforced_by.
##############################################################################

schema_version = 1

# ---------------------------------------------------------------- axis
[invariants.INV-AUTH-0]
statement = "An E-level never implies an L-level and vice versa. Authority on one axis is not convertible into authority on another by any automated process."
owner_rem = "REM-003"
enforced_by = ["CI-006", "A-030"]
kind = "structural"

