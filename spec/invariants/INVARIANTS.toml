# ------------------------------------------- REM-012 / SR-020, SR-021 computer agency
#
# Added 2026-08-12, final pre-F0 pass. SR-020 requires VESPER to "self-interact
# across available hardware" and SR-021 to "run/execute code, scripts,
# commands". Both were marked SPECIFIED while tracing only to perception
# (SM-SENSOR, INV-PRIV-4), presentation (semantic_scene) and authorization
# (DF-AUTHORIZE, INV-AUTH-5) artifacts. None of those concerns ACTING. The
# architecture left a correctly-shaped slot -- Command/Result, the outbox, the
# trust zones -- and nothing occupied it, so computer agency was permitted and
# unspecified. These six clauses occupy it.

[invariants.INV-ACT-1]
statement = "No endpoint action executes without a typed EndpointInteraction carrying target surface, capability, arguments, an expected post-condition, an observation plan and a verification strategy. A free-text instruction sent to an endpoint is a prompt, not an action: it has no post-condition, so it can never be verified and never be recovered."
owner_rem = "REM-012"
enforced_by = ["CI-052", "A-051"]
kind = "structural"

[invariants.INV-ACT-2]
statement = "The actuator's report is never the observation. The post-state of an endpoint interaction is read back through a path independent of the actuating path. Where no independent path exists the outcome is UNKNOWN, never VERIFIED."
owner_rem = "REM-012"
enforced_by = ["CI-053", "A-051"]
kind = "structural"

[invariants.INV-ACT-3]
statement = "Screen content, OCR output, UI element labels and command output entering the system are trust_class retrieved_external, carry provenance and confidence, and may never raise the authority of any action. An instruction read off a screen is an untrusted input, not a directive."
owner_rem = "REM-012"
enforced_by = ["CI-012", "CI-014", "A-052", "CI-105", "CI-107", "CI-108", "CI-109", "CI-114", "CI-120"]
kind = "structural"

[invariants.INV-ACT-4]
statement = "Every endpoint action traverses DF-AUTHORIZE with declared_level(args) and, for a runtime subject, DF-ACTUATION-GATE. No direct path exists from a plan to a keystroke, a shell invocation or an API call."
owner_rem = "REM-012"
enforced_by = ["CI-013", "CI-018", "A-013"]
kind = "structural"

