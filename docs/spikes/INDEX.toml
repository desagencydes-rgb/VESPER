##############################################################################
# VESPER SPIKE REGISTRY
#
# A spike is a TIME-BOXED MEASUREMENT with a stated pass condition, a stated
# fail condition, and a stated disposition for each. It is not a research
# period. A spike that can only conclude "we looked into it" has no deliverable
# and cannot close anything.
#
# Every entry declares:
#   protocol       the file containing the executable measurement procedure
#   question       the single question the spike answers
#   pass_criteria  the measurable condition under which the answer is YES
#   on_fail        WHAT HAPPENS IF THE ANSWER IS NO -- stated in advance, so it
#                  is not decided under schedule pressure by whoever is holding
#                  the failing number
#   blocks         what cannot proceed until this spike reports
#   time_box       the point at which an inconclusive spike is itself a result
#
# THE RULE THAT GOVERNS EVERY SPIKE IN THIS REGISTRY:
#
#   Where a requirement is not met on the measured hardware, the deliverable is
#   a COC Part XIV.3 limitation record with an R&D path. NEVER a relaxed
#   requirement, and never a re-measurement on better hardware reported as the
#   result.
#
# Enforced by tools/reference_lint.py (CI-050): every SPIKE id referenced by a
# normative document must appear here with a protocol, pass_criteria and
# on_fail. Namespace authority: docs/AUTHORITY_AND_PRECEDENCE.md §5.
##############################################################################

schema_version = 1
authority = "Engineering Foundation 'RESEARCH SPIKE' category · docs/AUTHORITY_AND_PRECEDENCE.md §5"
status_vocabulary = ["NOT_STARTED", "RUNNING", "REPORTED", "SUPERSEDED"]

[spikes.SPIKE-001]
title = "Node capability profiles, measured"
protocol = "docs/spikes/SPIKE-001-node-capability-profiles.md"
status = "RUNNING"
status_note = """RUNNING since 2026-08-13. 3.2 CLOSED 2026-08-15 -- see below.

3.1 IS COMPLETE on this node as of 2026-08-14T23:42Z: 6 configurations (draft x2, small,
standard, strong x2) x 2 load conditions x 3 x 10-minute runs, all under harness
schema_version 3, all sampled at minute 10 and flagged as the final checkpoint. 3.3 and 3.6
are closed.

3.2 IS CLOSED as of 2026-08-15, and it produced the hardest constraint in the spike. Measured
with the owner's real working set open, 3 conditions x 180 s x 36 samples, reporting the WORST
sample rather than the mean. Free RAM: 6.57 GB with no model, 2.85 GB with the standard tier
resident, 0.27 GB with the strong tier -- and at that point the machine pages at 660 pages/sec
against 10.8 for standard. THE STRONG TIER AND THE OWNER'S WORKING SET CANNOT COEXIST ON THIS
NODE. Two structural consequences: the 3.4 human-present degradation mode must UNLOAD the
strong model rather than deprioritise it (a scheduler that lowers its priority pages the
owner's browser instead), and residency cost is a function of HOST RAM, not VRAM alone -- a
fully GPU-offloaded model still costs ~3.7 GB of system RAM. Both are now enforced in
core/router.py, which fails closed when the required tier does not fit. 3.5 skipped by owner
direction; 3.4 closed as policy. The one instrument-blocked item is wall power (SPIKE-011).

Two defects were found in the reporting and corrected, both of the same class -- a metric
whose boundary sits somewhere other than where its name implies. (1) Checkpoint aliasing at
strong, fixed by streaming in schema_version 3. (2) The two headline aggregates were taken
over different windows -- minute-10 generation against a whole-run-average wall rate -- which
overstated the MoE's settled throughput by 27%. Re-derived from the existing run_results by
tools/spike/reaggregate.py at schema_version 4; no re-measurement was needed because the
samples were never wrong. Both are written up in docs/planning/spike-results/README.md as
Findings 4 and 6.

Nothing promoted to capability_profiles.toml; it keeps measured = false.

CRITERION 4 IS DISPOSITIONED, NOT PENDING -- owner decision 2026-08-14. A 7-day passive
window was started and then WITHDRAWN the same day as incoherent: the sampler runs ON the
node, so it cannot observe the node while the node is off, and the node is off whenever
the owner is not at it. Seven days of that measures the owner's working hours, not the
machine's availability, and the machine being measured is not the machine that will exist
after relocation. availability_class for this node is therefore DECLARED by owner policy,
not observed, and is recorded as declared. The 3.4 policy lock of 2026-08-13 already said
this; the window was a re-opening of a closed decision.

DECLARED: the node is treated as AVAILABLE, on the operational commitment that it is left
powered on and dedicated to VESPER after relocation, with a human-present degradation mode
(confine VESPER to light work while someone is at the machine, restore on their leaving).
The commitment is the load-bearing part: INV-TRUST-2 forbids placing continuity-critical
capability on a node that can be off with no way back, and SPIKE-010 records that VESPER
cannot wake this one. So `always_on` is safe to declare exactly as long as the machine is
in fact left on, and unsafe the moment it is not -- which is an operating condition to
honour, not a measurement to take."""
question = "What can each candidate node actually sustain, and what is the minimum viable profile for SR-005 local fallback?"
pass_criteria = "Every field in contracts/policy/capability_profiles.toml currently marked UNKNOWN carries a MEASURED value for at least one candidate node, and at least one node meets the declared minimum for local_inference_small."
on_fail = "If no candidate node sustains local_inference_small, SR-005's local fallback does not close on available hardware. Deliverable is a COC Part XIV.3 limitation record with an R&D path, plus a hardware recommendation. The requirement is NOT narrowed."
blocks = ["ADR-015", "hardware purchase decision", "SR-005 depth", "SR-006 depth", "SPIKE-002 (needs the minimum profile)"]
time_box = "5 working days per candidate node"
owner_role = "Core Systems Engineer · Device/Network Engineer"
requires_hardware = true

[spikes.SPIKE-002]
title = "Voice interaction latency chain on the minimum profile"
protocol = "docs/spikes/SPIKE-002-latency-chain.md"
status = "NOT_STARTED"
question = "Does the SR-046 x SR-047 x RB-004 x SR-045 chain close on the MINIMUM profile, offline, in FREE_TIME, with local models only?"
pass_criteria = "Every path in contracts/policy/latency_budgets.toml meets its budget_ms at p95, measured on the minimum profile under the declared conditions, with wake_to_first_audio and speech_end_to_response_onset asserted INDEPENDENTLY of total completion."
on_fail = "COC Part XIV.3 limitation record with an R&D path, naming the specific stage that does not close and by how much. Budgets are NOT relaxed (INV-PERF-1); the path is not redefined so the slow part falls outside it; and a measurement on a stronger profile is not reported in its place."
blocks = ["SR-047 verification", "A-020", "R2 gate"]
depends_on = ["SPIKE-001"]
rescoped = """2026-08-14, owner decision on device roles. This spike says "on the MINIMUM
profile", written as though one machine captures audio, runs inference and speaks. That is
not the architecture. Voice and hearing live on the phones, never on the site-A desktop --
which is why SPIKE-001 3.5 was already skipped there.

The trap this avoids: the chain was about to be scoped as phone-hears -> desktop-thinks ->
phone-speaks, which puts a CROSS-SITE NETWORK HOP inside a 1200 ms end-to-end budget that
currently accounts for ZERO network time. The owner rejected that path outright: the iPhone
is to run standalone on small local models or an API, inside an app built on the MacBook.

So this spike must be measured ON THE IPHONE against local-or-API inference. The desktop is
not in the voice chain at all, and a desktop measurement would be a measurement of the wrong
machine -- exactly what 5 forbids. Blocked on the iPhone app existing, which is blocked on
the MacBook being acquired."""
time_box = "10 working days"
owner_role = "Presence & Interaction Engineer · Intelligence Systems Engineer"
requires_hardware = true

