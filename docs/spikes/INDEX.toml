[spikes.SPIKE-012]
title = "Residency manager -- multi-model, multi-agent orchestration on one GPU"
protocol = "docs/spikes/SPIKE-012-residency-manager.md"
status = "NOT_STARTED"
question = "On a single 8 GB GPU, which residency modes are actually viable, and can a residency manager switch between them, serve concurrent agents, and defend against swap thrash without a person present?"
pass_criteria = "For each declared residency mode in docs/planning/INFERENCE_ARCHITECTURE.md: either the mode loads and serves within its VRAM budget with measured tokens/sec under concurrent load, or it is recorded as NOT VIABLE on this hardware with the measured reason. Plus: concurrent agents sharing one model via parallel slots scale without per-agent model duplication; a mode switch completes within a stated budget; anti-thrash policy demonstrably caps swap rate under adversarial mixed-model demand; a model with a request in flight is never evicted; headroom reservation keeps the machine responsive throughout; and under a FOREIGN GPU workload (a household member starting a game or other GPU-heavy application) VESPER yields rather than thrashing, the foreign application stays usable, and what VESPER loses plus its recovery time are recorded."
on_fail = "Any mode that cannot hold its VRAM budget is recorded as NOT VIABLE on 8 GB with its measured shortfall -- it is NOT rescued by silently shrinking the model, dropping context, or re-measuring on better hardware. If anti-thrash cannot bound the swap rate under adversarial demand, ELASTIC mode is restricted to a fixed resident set and the limitation is recorded. If VESPER cannot yield to a foreign GPU workload without thrashing, the resident set is capped low enough that a household application can always start, and the cap is recorded as a limitation -- the machine belongs to the household first. NOT permitted: reporting single-agent throughput as concurrent throughput; reporting a warm-model latency as a mode-switch cost; claiming a mode works without sustained-load measurement; allocating VRAM to the last byte and calling the machine responsive; or measuring contention only against VESPER's own workloads when the real machine is shared."
blocks = ["the VESPER inference stack build", "capability_profiles local_inference fields for the site-A desktop", "any multi-agent placement on the site-A desktop"]
depends_on = ["SPIKE-001", "SPIKE-011"]
time_box = "4 working days"
owner_role = "Core Systems Engineer"
requires_hardware = true
raised_by = "Owner, 2026-08-13. VESPER needs multiple models, multiple tasks and multiple agents concurrently -- which invalidated an earlier assumption that the node serves one request at a time. Design recorded in docs/planning/INFERENCE_ARCHITECTURE.md: residency states (ACTIVE/WARM/DORMANT/COLD), selectable residency modes (SOLO_MAX, LEAD_SCOUT, COUNCIL, SWARM, ELASTIC, DORMANT_ALL) over a fixed VRAM budget, and concurrency served by parallel slots on a resident model rather than by duplicating models. This spike is the LAST orchestration spike by owner direction -- it deliberately absorbs headroom monitoring, task tracking, priority and swap policy so that no further spike needs opening before the build proceeds."

[spikes.SPIKE-013]
title = "The home's ground: composite cost, and whether dispersal is affordable"
protocol = "docs/spikes/SPIKE-013-home-ground-composite.md"
status = "RUNNING"
status_note = """RUNNING since 2026-08-23. The PRECONDITION is answered and it is
a NO. The spike's own question -- what the composite COSTS -- still has no
numbers, and cannot get honest ones until the fallback is chosen, because a
configuration that cannot ship is not a configuration worth measuring.

CAN A WKWebView BE TRANSPARENT OVER THE FACE WITH PUBLIC API ONLY?  NO.

Measured by app/home-macos/glass_probe.swift on macOS 26.5 build 25F71, run
twice at two window levels (the ground's own normal-1, occluded; and floating,
visible) with identical readings. The reader is the WINDOW SERVER'S composite of
our own window -- the only reader that sees layers WebKit draws out of process.
Three controls ran first and all passed:

  A1  our window came back at all: blue over red, right way up, 1280x840
  A2  a window with nothing in it came back alpha 0 -- transparency IS readable
  B1  a page painted edge to edge in #FF00FF came back #FF00FF -- the reader
      SEES WebKit content. This is the control both earlier instruments failed.

  C1  default WKWebView, page background: transparent        #FFFFFF opaque
  C2  + underPageBackgroundColor = .clear                    #FFFFFF opaque
  C3  + layer.isOpaque = false                               #FFFFFF opaque
  C4  the same over a CLEAR ground -- the whole stack        #FFFFFF opaque
  C5  the same with the real glass chrome                    #FFFFFF opaque
  C6  the same over a CAMetalLayer, the home's own ground    #FFFFFF opaque
  D1  PRIVATE _setDrawsBackground:false                      ground shows through
  E1  LEGACY WebView.drawsBackground = false  (PUBLIC)       ground shows through

underPageBackgroundColor is not being ignored. It is set, held, and reads back
as alpha 0.00 -- and the webview still paints white. It is the scroll-bounce
colour its own SDK header says it is. It is also the entire public surface on
WKWebView: grepping this machine's SDK for macos(26) additions turns up Screen
Time, instant back, obscured content insets and data restore, and nothing about
background.

D1 and E1 are what make this a finding rather than a blind spot. On the same
instrument, in the same run, two configurations DID read the ground through the
webview. The reader can tell transparent from opaque; the public knobs on
WKWebView cannot produce it.

E1 also narrows the sentence. drawsBackground IS public -- on the LEGACY WebKit1
WebView (WebView.h:504), deprecated since 10.14. So the finding is not "no
public route exists", it is "no public route exists ON WKWebView", and the route
that does exist costs a deprecated in-process engine and forecloses Tauri, whose
macOS backend is a WKWebView.

AND ONCE IT IS TRANSPARENT, THE GLASS REACHES THE GROUND. Measured on the same
instrument: a card blurring across a hard edge in the ground smears that edge
over 41-42 pt inside the card and leaves it 0 pt outside, on both routes and
over a real CAMetalLayer as readily as a CALayer. It could have gone the other
way -- a backdrop filter samples the page's own backdrop and the field is not in
the page. So SS1.1's look is achievable and only the transparency is missing,
which makes fallback 1 (opaque panels) worse than it looked: with no backdrop
the glass becomes a flat panel and the design's central material is gone.

DECIDED 2026-08-23: the fourth option, the private setter, on the condition that
its failure stops being silent -- which is the condition ISLAND-ARCHITECTURE SS2's
own reasoning asks for, since SS2 bans private API BECAUSE the failure is silent.
Landed in bdc70ac: GlassGuard.swift as the one place the selector may appear,
carrying the reader and three controls it runs every time; --glass-verify
answering TRANSPARENT/OPAQUE/UNREADABLE at exit 0/1/2, where UNREADABLE is NOT a
pass; --glass-verify --no-hatch as a permanent negative control, measured red at
#FFFFFF without the hatch and green with it; CI-058 refusing the selector in any
unmarked file and refusing it in GlassGuard.swift if the reader or the negative
control is removed; INV-HOME-5 promoted from candidate with the exception written
into it, traced to SR-002.

SS1 PARTLY DELIVERED 2026-08-24, on battery at 22-27%, never mains. Composite
cost +0.053% of one core (composite - centre, three interleaved runs each).
Criterion 3 PASS: ABSENT draws 0 frames, every run. Criterion 2 INCONCLUSIVE:
centre 0.222 [0.193-0.263] against dispersed 0.244 [0.223-0.275], and
overlapping ranges mean the axis cannot separate them -- SS3's refusal to relax
the requirement to "about the same" cuts both ways, so it is equally not met by
it. Criteria 1, 5 and 6 still need powermetrics and sudo.

CRITERION 4 FOUND A DEFECT THE SPIKE WAS NOT LOOKING FOR. The ground held 116.8
fps while fully covered: didChangeOcclusionStateNotification had been delivered
ZERO times, so Home.swift's deliberate stop -- the mechanism the host-lifetime
goal rests on -- had never once run. The notification works at .floating in 0.02
s; it does not arrive for the ground specifically (full screen, normal-1,
transparent, .managed). OcclusionWatch keeps it and adds a 0.5 s poll of
occlusionState, proven alone with the notification disconnected. Full-scale
criterion 4 is still owed and belongs on VESPER's own Desktop, because forcing
it means covering the whole display.

The 90 home cards are UNBLOCKED. SS1's six-configuration cost table is now
measurable against a configuration that ships, which is what this precondition
existed to secure, and its on_fail fallbacks stand unchanged."""
question = "What does VESPER's home ground actually cost -- a Metal ambience/face layer beneath a full-screen transparent webview -- and is the DISPERSED face tier cheaper than CENTRE, as the presence law requires?"
pass_criteria = "Six measured configurations (baseline, Metal alone, composite, attendant, dispersed, absent) plus occlusion, each with CPU, GPU, package power and battery drain read from the system rather than from the renderer's own frame counter. DISPERSED <= CENTRE on every axis. ABSENT and occluded both draw zero frames with no timer, proven by counter. A decided idle cadence with its measured power difference from 60 fps, and the resulting hours of home-open battery runtime."
on_fail = "If the composite cannot hold its budget, exactly one of three named fallbacks is taken with its cost stated: the webview loses transparency, the field moves into the webview and Metal is dropped, or the ground renders at a lower cadence. If DISPERSED costs more than CENTRE, the dissolve is not shipped as specified -- it becomes a cut to a still field and the owner is told the particle dispersal is not affordable on this host. THE REQUIREMENT IS NOT RELAXED TO 'ABOUT THE SAME'. Not permitted: a figure measured on mains reported as the battery figure; Metal-alone reported as the composite's cost; a point count chosen before the power is measured; a mean reported where the worst sample governs."
blocks = ["HOME-ARCHITECTURE.md build steps F1-F3", "the four face presence tiers", "the dissolve as a motion-vocabulary addition"]
depends_on = ["SPIKE-002"]
time_box = "2 working days"
owner_role = "Platform Engineer"
requires_hardware = true
raised_by = "docs/design/HOME-ARCHITECTURE.md SS8 and SS11, 2026-08-22. ISLAND-ARCHITECTURE.md SS6 already set the rule for the island's face -- its power draw is measured before its point count is chosen. The home makes that rule bigger: full screen rather than 627 pt, a webview composited over the same renderer, and a fourth tier whose cost is ASSUMED to be lower than the head it replaces and could easily be higher."

