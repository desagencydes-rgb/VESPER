<style>
/* ---- hero ---- */
.hero{padding:66px 0 30px;display:grid;grid-template-columns:1fr 300px;gap:52px;align-items:center;}
@media(max-width:820px){.hero{grid-template-columns:1fr;gap:30px;padding-top:44px}}
.heroicon{width:300px;height:300px;border-radius:50%;object-fit:cover;justify-self:center;
  filter:drop-shadow(0 0 60px rgba(255,175,149,.30));}
.statusrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:24px;}
.pill{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  padding:5px 11px;border-radius:99px;border:1px solid var(--line);color:var(--ink-3);background:var(--glass);}
.pill.on{color:var(--accent);border-color:color-mix(in oklab,var(--accent) 45%,transparent);}
.pill.wait{color:var(--blush);border-color:color-mix(in oklab,var(--blush) 42%,transparent);}

/* ---- generic grid + card ---- */
.grid{display:grid;gap:16px;}
.g2{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{padding:22px 24px;}
.card h3{margin-bottom:8px;} .card p:last-child{margin-bottom:0;}
.k{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);}

/* ---- swatches ---- */
.sw{border-radius:var(--r-card);overflow:hidden;border:1px solid var(--line);transition:transform .3s var(--smooth);}
.sw:hover{transform:translateY(-3px);}
.swtop{height:104px;display:flex;align-items:flex-end;padding:11px 13px;}
.swtop b{font-family:"Instrument Serif",serif;font-weight:400;font-size:23px;mix-blend-mode:normal;}
.swbot{padding:11px 13px;background:var(--glass);}
.swbot .mono{display:block;font-size:11px;color:var(--ink-2);}
.swbot .role{font-size:12.5px;color:var(--ink-3);margin-top:4px;line-height:1.42;}

/* ---- tables ---- */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-card);background:var(--glass);}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px;}
th{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);text-align:left;font-weight:500;padding:13px 15px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:11px 15px;border-bottom:1px solid var(--line-2);color:var(--ink-2);vertical-align:top;}
tr:last-child td{border-bottom:0;}
td b{color:var(--ink);font-weight:500;}
.num{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:12.5px;}

/* ---- ambience ---- */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px;}
.mode{border-radius:var(--r-card);overflow:hidden;border:1px solid var(--line);cursor:pointer;position:relative;
  background:var(--glass);text-align:left;padding:0;color:inherit;font:inherit;
  transition:transform .35s var(--smooth),border-color .3s,box-shadow .35s;}
.mode:hover{transform:translateY(-4px);box-shadow:0 22px 46px -22px var(--cast);}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 22px 46px -22px var(--cast);}
.mode img{width:100%;height:118px;object-fit:cover;display:block;}
.modeb{padding:13px 15px 15px;}
.modeb h4{font-size:19px;margin-bottom:3px;}
.modeb .when{font-size:12.5px;color:var(--ink-3);line-height:1.46;min-height:2.9em;}
.dots{display:flex;gap:4px;margin-top:10px;}
.dots i{width:15px;height:15px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);}

/* ---- face stage ---- */
.stage{position:relative;border-radius:var(--r-sheet);overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(180deg,var(--ground-2),var(--ground));min-height:430px;}
#facecv{display:block;width:100%;height:430px;}
.holo{position:absolute;border-radius:14px;padding:9px 12px;max-width:210px;pointer-events:none;
  border:1px solid color-mix(in oklab,var(--accent) 46%,transparent);
  background:color-mix(in oklab,var(--accent) 9%,transparent);
  -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
  opacity:0;transform:translateY(7px) scale(.965);transition:opacity .5s var(--smooth),transform .5s var(--smooth);}
.holo.on{opacity:1;transform:none;}
.holo .k{color:color-mix(in oklab,var(--accent) 76%,var(--ink));margin-bottom:3px;}
.holo p{font-size:12.5px;line-height:1.5;margin:0;color:var(--ink-2);}
.holo .hand{font-size:17px;color:var(--accent);line-height:1.35;}
.ctrl{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px;}
.btn{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--glass);color:var(--ink-2);
  cursor:pointer;transition:transform var(--d-snappy) var(--snappy),background .25s,color .25s,border-color .25s;
  -webkit-backdrop-filter:blur(13px);backdrop-filter:blur(13px);}
.btn:hover{color:var(--ink);border-color:color-mix(in oklab,var(--accent) 50%,transparent);}
.btn:active{transform:scale(.955);}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

/* ---- island / dock demo ---- */
.screen{position:relative;border-radius:var(--r-sheet);overflow:hidden;border:1px solid var(--line);
  aspect-ratio:1728/1117;background:#0a1a24;min-height:290px;}
.screen .wall{position:absolute;inset:0;object-fit:cover;width:100%;height:100%;opacity:.62;}
.menubar{position:absolute;top:0;left:0;right:0;height:5.5%;background:rgba(3,20,31,.42);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:2;}
.notch{position:absolute;top:0;left:44.62%;width:10.71%;height:5.5%;background:#000;z-index:4;border-radius:0 0 9px 9px;}
.island{position:absolute;top:6.6%;left:50%;transform:translateX(-50%);z-index:5;
  border-radius:99px;padding:6px 14px;display:flex;align-items:center;gap:8px;
  background:rgba(6,26,38,.72);border:1px solid rgba(255,234,227,.20);
  -webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 10px 26px -12px #000;
  transition:width var(--d-snappy) var(--snappy),height var(--d-snappy) var(--snappy),border-radius var(--d-snappy) var(--snappy),padding var(--d-snappy) var(--snappy);}
.island img{width:15px;height:15px;border-radius:50%;flex:none;}
.island .t{font-size:10.5px;color:#ffeae3;white-space:nowrap;font-weight:300;}
.island .eq{display:flex;gap:2px;align-items:flex-end;height:11px;}
.island .eq i{width:2px;background:var(--orange);border-radius:1px;animation:eq 1.1s var(--smooth) infinite;}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}
.island.big{width:58%;height:52%;border-radius:26px;padding:12px;flex-direction:column;align-items:stretch;gap:7px;}
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:2.4%;z-index:3;
  display:flex;gap:7px;padding:7px 11px;border-radius:19px;
  background:rgba(6,26,38,.62);border:1px solid rgba(255,234,227,.17);
  -webkit-backdrop-filter:blur(30px) saturate(200%);backdrop-filter:blur(30px) saturate(200%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.20),0 14px 30px -14px #000;
  transition:transform var(--d-smooth) var(--smooth),opacity var(--d-smooth) var(--smooth);}
.dock i{width:23px;height:23px;border-radius:6px;display:block;}
.dock.osdock{z-index:6;background:rgba(240,240,245,.42);border-color:rgba(255,255,255,.42);transform:translateX(-50%) translateY(140%);}
.screen.summon .dock.osdock{transform:translateX(-50%) translateY(0);}
.screen.summon .dock.vdock{transform:translateX(-50%) translateY(12%);opacity:.30;}
.hotzone{position:absolute;left:0;right:0;bottom:0;height:13%;z-index:7;cursor:pointer;}

/* ---- misc ---- */
.note{border-left:2px solid var(--accent);padding:2px 0 2px 17px;margin:22px 0;color:var(--ink-2);font-size:15px;}
.note b{color:var(--accent);}
.refwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px;}
.refwall figure{margin:0;border-radius:13px;overflow:hidden;border:1px solid var(--line);background:var(--glass);}
.refwall img{width:100%;height:104px;object-fit:cover;display:block;}
.refwall figcaption{padding:8px 10px;font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);line-height:1.5;}
.spec{display:grid;grid-template-columns:auto 1fr;gap:4px 20px;font-size:14px;align-items:baseline;}
.spec dt{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;}
.spec dd{margin:0;color:var(--ink-2);}
.yes{color:var(--ok);} .no{color:var(--ember);}
footer{padding:60px 0 90px;color:var(--ink-3);font-size:13px;border-top:1px solid var(--line-2);margin-top:60px;}
</style>
