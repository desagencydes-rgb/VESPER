# Provenance for the owner's UI reference set, received 2026-08-21.
#
# The committed files are lossless crops of the island out of full-desktop composites.
# The composites are not committed: their wallpaper does not compress, and three of them
# cost more than this entire repository (.git was 9.1 MB). What is committed is the part
# that is actually the reference, at native resolution, plus one context frame.
#
# `scale` is the composite's px per logical point (authored width / 1728 pt) and `crop_x`
# the crop origin, so island_geom.py can still report x in screen coordinates from a
# cropped file. `sha256` is of the ORIGINAL as delivered, not of the committed crop.

