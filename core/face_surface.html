<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>VESPER</title>
<style>
/* THE DISPLAY NODE RUNS CHROME 55. No CSS min(), no optional chaining, no object
   spread: SPIKE-004's page found min() unparseable on that handset and every
   pyramid face fell back to shrink-to-fit. Sizes are measured in px by the script. */
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:fixed;left:50%;top:50%;width:0;height:0}
#stage.mirror{transform:scaleX(-1)}
.face{position:absolute}
.face.n{transform:translate(-50%,-100%) rotate(180deg)}
.face.s{transform:translate(-50%,0%) rotate(0deg)}
.face.w{transform:translate(-100%,-50%) rotate(90deg)}
.face.e{transform:translate(0%,-50%) rotate(-90deg)}
#hud{position:fixed;left:6px;bottom:6px;font:15px/1.35 Roboto,-apple-system,sans-serif;color:#b8b8b8}
#hud.error{color:#ff8a80}
</style></head><body>
<div id="stage"></div><div id="hud">connecting to VESPER</div>
<script>
// A BLACK SCREEN MUST SAY WHY (2026-09-14). The owner opened this on the phone
// and saw a blank page, with nothing on it to tell a script error from a slow
// download from a wrong address. So an error prints itself, in readable type.
window.onerror = function (msg, src, line) {
  var h = document.getElementById('hud');
  if (h) { h.className = 'error'; h.textContent = 'the face page failed: ' + msg + ' (line ' + line + ')'; }
};
(function () {
  'use strict';
  // THE SAME FACE, A SECOND SURFACE (HOME-WORKBENCH §32.1). The cloud is the
  // island's own face.bin -- x, y, z, intensity as little-endian float32 -- so
  // this draws what the island draws, subsampled because the node is a phone.
  // How many points it sustains is measured below and reported, not assumed.
  var MAX_POINTS = 9000;
  // DESIGN-FOUNDATION §8, the envelope every behaviour shares.
  var YAW_MAX = 18 * Math.PI / 180, PITCH_MAX = 12 * Math.PI / 180;
  var BUCKETS = 6;
  var buckets = null, total = 0, behaviour = 'resting';
  var hud = document.getElementById('hud'), stage = document.getElementById('stage');
  var off = document.createElement('canvas'), octx = off.getContext('2d');
  var faces = [], edge = 40;

  function layout() {
    var unit = Math.floor(Math.min(window.innerWidth, window.innerHeight) / 2);
    edge = Math.max(40, Math.floor(unit * 0.88));
    off.width = edge; off.height = edge;
    stage.innerHTML = '';
    faces = ['n', 'e', 's', 'w'].map(function (d) {
      var c = document.createElement('canvas');
      c.width = edge; c.height = edge; c.className = 'face ' + d;
      stage.appendChild(c);
      return c.getContext('2d');
    });
  }
  window.addEventListener('resize', layout);
  // A reflection reverses the image; one tap mirrors it back for the rig in hand.
  document.body.addEventListener('click', function () {
    stage.className = stage.className === 'mirror' ? '' : 'mirror';
  });
  layout();

  function load() {
    var x = new XMLHttpRequest();
    x.open('GET', 'face.bin');
    x.responseType = 'arraybuffer';
    // THE DOWNLOAD SAYS HOW FAR IT HAS GOT. The cloud is ~600 KB, and over a
    // phone's hotspot that is seconds of black screen with nothing to read.
    x.onprogress = function (e) {
      if (e.lengthComputable && e.total > 0) {
        hud.textContent = 'loading VESPER\'s face ' + Math.round(100 * e.loaded / e.total) + '%';
      }
    };
    x.onload = function () {
      if (x.status !== 200 || !x.response || x.response.byteLength < 20) {
        hud.textContent = 'VESPER did not send its face';
        return;
      }
      var dv = new DataView(x.response), n = dv.getUint32(0, true);
      var step = Math.max(1, Math.floor(n / MAX_POINTS)), lists = [], b;
      for (b = 0; b < BUCKETS; b++) lists.push([]);
      for (var i = 0; i < n; i += step) {
        var o = 4 + i * 16;
        if (o + 16 > x.response.byteLength) break;
        var it = dv.getFloat32(o + 12, true);
        b = Math.min(BUCKETS - 1, Math.max(0, Math.floor(it * BUCKETS)));
        lists[b].push(dv.getFloat32(o, true), dv.getFloat32(o + 4, true), dv.getFloat32(o + 8, true));
      }
      buckets = lists.map(function (l) { return new Float32Array(l); });
      total = buckets.reduce(function (s, a) { return s + a.length / 3; }, 0);
      hud.textContent = total + ' of ' + n + ' points';
    };
    x.onerror = function () { hud.textContent = 'VESPER is not reachable from here'; };
    x.send();
  }
  load();

  function poll() {
    var x = new XMLHttpRequest();
    x.open('GET', 'state.json');
    x.onload = function () {
      try {
        var s = JSON.parse(x.responseText);
        if (s && typeof s.behaviour === 'string') behaviour = s.behaviour;
      } catch (e) { /* keep the last behaviour; the face never stops for a poll */ }
    };
    x.send();
  }
  poll();
  setInterval(poll, 2000);

  // A MOTION FIELD, NEVER A CLIP (DESIGN-FOUNDATION §8): sums of incommensurable
  // periods, so nothing loops visibly. A behaviour sets urgency, not amplitude.
  var URGENCY = {looking: 1.0, thinking: 0.6, wondering: 0.8, imagining: 0.7, working: 0.35,
                 acting: 0.9, listening: 0.4, talking: 0.3, laughing: 0.9, joking: 0.6,
                 angry: 0.7, happy: 0.6, resting: 0.15, aura: 0.05};
  var yaw = 0, pitch = 0;
  function clamp(v) { return Math.max(-1, Math.min(1, v)); }
  function target(t) {
    var u = URGENCY[behaviour] || 0.2;
    var ty = u * (Math.sin(t * 0.37) + 0.6 * Math.sin(t * 0.113 + 1.3) + 0.3 * Math.sin(t * 0.051 + 2.1)) / 1.9;
    var tp = u * (Math.sin(t * 0.29 + 0.7) + 0.5 * Math.sin(t * 0.083 + 0.2)) / 1.5;
    if (behaviour === 'thinking' || behaviour === 'imagining') tp = Math.abs(tp) * 0.8 + 0.2 * u;
    return [clamp(ty) * YAW_MAX, clamp(tp) * PITCH_MAX];
  }

  var frames = 0, fpsT0 = Date.now(), fps = 0, reportT = Date.now();
  function frame() {
    requestAnimationFrame(frame);
    if (!buckets) return;
    var t = Date.now() / 1000, tg = target(t);
    yaw += (tg[0] - yaw) * 0.06;
    pitch += (tg[1] - pitch) * 0.06;
    var half = edge / 2, sc = edge * 0.42;
    var cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    octx.globalCompositeOperation = 'source-over';
    octx.fillStyle = '#000';
    octx.fillRect(0, 0, edge, edge);
    // ADDITIVE, as the island's renderer blends: dense areas accumulate light.
    octx.globalCompositeOperation = 'lighter';
    for (var b = 0; b < buckets.length; b++) {
      var p = buckets[b];
      if (!p.length) continue;
      octx.fillStyle = 'rgba(255,255,255,' + (0.18 + 0.8 * (b + 0.5) / BUCKETS).toFixed(2) + ')';
      for (var i = 0; i < p.length; i += 3) {
        var x = p[i], y = p[i + 1], z = p[i + 2];
        var x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
        var y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
        var persp = 1 / (1 - 0.18 * z2);
        octx.fillRect(half + x1 * persp * sc, half - y2 * persp * sc, 1.5, 1.5);
      }
    }
    for (var k = 0; k < faces.length; k++) {
      faces[k].clearRect(0, 0, edge, edge);
      faces[k].drawImage(off, 0, 0);
    }
    frames++;
    var now = Date.now();
    if (now - fpsT0 >= 2000) {
      fps = frames * 1000 / (now - fpsT0);
      frames = 0; fpsT0 = now;
      hud.textContent = behaviour + ' · ' + fps.toFixed(1) + ' fps measured here · ' + total + ' points';
    }
    // THE NODE REPORTS WHAT IT SUSTAINED (§32.2, INV-HW-2): measured on the device.
    if (now - reportT >= 15000 && fps > 0) {
      reportT = now;
      var r = new XMLHttpRequest();
      r.open('GET', 'reading?fps=' + fps.toFixed(1) + '&points=' + total +
             '&w=' + window.innerWidth + '&h=' + window.innerHeight);
      r.send();
    }
  }
  requestAnimationFrame(frame);
})();
</script></body></html>
