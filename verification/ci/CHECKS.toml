note = """BUILT-AND-UNREACHED is the failure this exists for, and it is the one this corpus keeps rediscovering -- Provider.profile_id unread, egress applied only at registration, the face connected to nothing. core/persona.py can compose a flawless preamble and, until 2026-08-26, no branch in routing/supply.py had anywhere to put one. Each of the four wires spells it differently and there is no shared field to lean on, so each spelling is asserted by name: a wire added without one carries no persona and looks identical from outside."""
discriminators = "The cf_image branch is asserted in the NEGATIVE direction: an image request has no system role, and folding the preamble into the prompt would render `address the owner as sir` into the picture. The cli_subprocess rung is asserted to fold-and-label rather than to be equivalent -- a prepended preamble is a user turn and can be argued out of by the rest of the same message, which a real system turn resists, and the two rungs must not be silently reported as the same thing."

