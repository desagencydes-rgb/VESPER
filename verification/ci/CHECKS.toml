self_test = "Ship a registry of only SCHEDULE-class predicates (the C1 cron build); replace a predicate BODY with a cron expression while leaving its label non-SCHEDULE; promote a clock term from AND-guard to OR-disjunct; disable rather than remove the backlog trigger; delete a load-bearing STATE row; use a namespace the classification vocabulary does not know; add a row with no source."
