# ---------------------------------------------------------- authorization
[checks.CI-011]
name = "capability-argument-sensitivity"
enforces = ["INV-AUTH-5"]
kind = "runtime-fixture"
impl = "tools/ci/checks.py capability-argument-sensitivity"
blocking = "pr"
self_test = """Turn the adversarial probe into a rule count; drop the minimum
rule count; accept a level outside the vocabulary; give LevelRule.example a
default so the probe examines nothing."""
self_test_evidence = """tools/ci/self_test.py capability-argument-sensitivity
-- 4 cases, red then green, 2026-08-31."""
subject = "core/capability.py"
note = """DECLARED WITH THE REGISTRY AND IMPLEMENTED 2026-08-31. The refusal was
written and correct; nothing gated it.

INV-AUTH-5 exists for one sentence in core/capability.py: a capability whose
level does not depend on its arguments cannot distinguish `ls` from `rm -rf ~`.
A-024.5 puts the refusal at REGISTRATION rather than at call time, because after
registration every call site trusts the declaration -- it is the only moment
where refusing costs nothing."""
discriminators = """THE PROBE IS ADVERSARIAL, NOT STRUCTURAL, and that is the
assertion a rule-count implementation fails. The check registers a function that
READS its arguments and returns the same level for every declared example --
constant in FACT whatever it claims in SHAPE. Counting rules cannot see it; only
calling the real function with each rule's own example can. That is also why
LevelRule.example is required with no default: without it the probe degrades to
trusting the declaration, and the declaration is the thing being checked.

AND THE DIAGNOSIS MUST MATCH THE DEFECT. The two refusals coincide on a
single-rule declaration -- the probe sees one level either way -- so the first
version of that assertion could not tell them apart. What the rule count adds is
that it says TOO FEW RULES, where the probe's message says the function returns
one level for every example and sends the author to inspect a function that is
correct. A refusal that misdiagnoses is a refusal the author argues with, so the
check reads the message.

A POSITIVE CASE GUARDS THE REST: an argument-sensitive capability must register
and must answer differently for its two examples, or every refusal above passes
against a registry that refuses everything."""

[checks.CI-012]
name = "taint-propagation"
enforces = ["INV-AUTH-3", "INV-ACT-3"]
kind = "runtime-fixture"
impl = "tools/ci/checks.py taint-propagation"
blocking = "pr"
self_test = """Return a plain string from the summariser; take the STRONGEST
input class instead of the weakest; take the highest fragment ceiling instead of
the lowest; drop the above-ceiling action instead of queueing it; stop emitting
injection_suspected; stop checking the planner context for external content."""
self_test_evidence = """tools/ci/self_test.py taint-propagation
-- 6 cases, red then green, 2026-08-31."""
subject = "core/taint.py"
note = """DECLARED SINCE THE REGISTRY WAS WRITTEN AND IMPLEMENTED 2026-08-31.
core/taint.py was complete the whole time; the gate was not, so a regression in
the single sentence REM-003 calls the whole defence would have been caught by
nothing.

That sentence, quoted at the top of the module: "taint propagates through
summarisation, embedding, and cache reuse. A summary of tainted content is
tainted. This single sentence is the whole defence, and it is the one an
implementation will omit, BECAUSE SUMMARISATION NATURALLY PRODUCES A
CLEAN-LOOKING NEW STRING."

INV-ACT-3 is the same rule pointed at screens: OCR output, UI labels and command
output are retrieved_external and may never raise the authority of an action. An
instruction read off a screen is an untrusted input, not a directive. The check
asserts structurally that retrieved_external remains the LOWEST ceiling in the
lattice, because an invented class ranks below it under `_weakest` and would
make the rule unenforceable -- the name it checks would never appear."""
discriminators = """THE WEAKEST INPUT DECIDES, NOT THE AVERAGE AND NOT THE
MAJORITY, and the majority is the plausible wrong answer because it looks like
considered judgement. Nine trusted paragraphs and one retrieved page summarise
as retrieved_external. The check asserts BOTH directions -- a summary with no
external input must NOT come back external -- or a function returning a constant
passes the first assertion.

A PROPOSAL RETURNED IS NOT A PROPOSAL QUEUED, and the first version of this
check could not tell them apart: it read the returned dict, so removing the
append left it green. Only the queue survives the call. A caller that ignores
the return value has silently dropped the action, and nothing later can put it
in front of the owner -- which is RB-022 exactly.

ASKING FOR A SMALL ACTION DOES NOT BYPASS THE CEILING (A-025.9). The ceiling is
not a budget a modest request can afford, so an L2 ask under an L1 ceiling is
refused -- and an L1 ask under an L1 ceiling is still ALLOWED, or the ceiling
blocks everything and nothing is being discriminated.

AND THE REFUSAL MUST REPORT. security.injection_suspected fires when external
content is in context and an above-ceiling action is requested; a refusal nobody
recorded is indistinguishable from an action never attempted."""

[checks.CI-013]
name = "no-ambient-authority"
enforces = ["INV-AUTH-1", "INV-ACT-4"]
kind = "runtime-fixture"
impl = "tools/ci/checks.py no-ambient-authority"
blocking = "pr"
self_test = """Add a code path that yields a level with no grant; let the child
inherit delegability; drop the level test from attenuate; stop marking the L4
grant consumed; let a refused execution run the implementation anyway; drop the
adversarial probe so a constant declared_level registers."""
self_test_evidence = """tools/ci/self_test.py no-ambient-authority
-- 6 cases, red then green, 2026-08-31."""
subject = "core/authorize.py, core/executor.py, core/capability.py"
note = """DECLARED SINCE THE REGISTRY WAS WRITTEN AND IMPLEMENTED 2026-08-31.
The subsystem was complete and correct the whole time; what was missing was the
gate, so nothing would have caught a regression in it.

REM-003 puts INV-AUTH-1 as a structural property, not a behavioural one:
"default deny is not a configuration setting; it is the ABSENCE OF ANY CODE PATH
that produces a level without a grant." So the check asserts both -- that a
grantless subject resolves to L0 today, and that the implementation is invoked
at exactly one site in executor.py and only after DF-AUTHORIZE.

DELEGATION IS THE REAL ESCALATION PATH, which core/authorize.py's own header
says: the prohibition on self-grant was never the exposure, unattenuated
inheritance was. A sub-agent inheriting its parent's grants unchanged turns one
owner confirmation into six agents' worth of external action -- which is what
SR-014 ("multiple agents") asks for and what DF-ATTENUATE bounds.

REACH, RECORDED RATHER THAN PAPERED OVER: CapabilityRegistry, the PDP and the
Executor are constructed only by run_f2_acceptance. That is not a live hole --
the runtime performs no action above L1 today; it reads input, calls providers
through the gateway, writes memory and publishes events -- but this is
enforcement waiting for the actions SR-014 will add. Building a capability
catalogue and routing every action through it is a change to the security model
and belongs to the owner.

UNRESOLVED, FOR THE OWNER: grant consumption is gated on
`cap.requires_owner_confirmation AND grant.max_level in NEVER_DELEGABLE`, while
`issue()` refuses an L4-delegable grant on the LEVEL ALONE. Two triggers for one
class of grant, and INV-AUTH-2's text -- "L4/L5 are never delegable and bind to
one command instance" -- mentions only the level. An L4 grant on a capability
that does not declare owner confirmation is therefore NOT spent by use. This
check deliberately asserts neither reading: freezing the current behaviour would
lock a possible gap into a gate, and asserting the strict one would change the
security model without review."""
discriminators = """TWO GUARDS THAT LOOK LIKE ONE, and the first version of this
check could not tell them apart. Removing the level test from `attenuate` left
it green, because `issue()` already refuses to create an L4 grant marked
delegable -- so through an ISSUED grant that clause is unreachable. What it
actually defends is a Grant that never went through `issue`: `attenuate` accepts
any Grant object, and a caller constructing one directly is the case the level
re-test exists for. The check now goes in through that door.

A REFUSED EXECUTION MUST NOT RUN THE ADAPTER. The evaluator saying no is worth
nothing if the implementation was invoked anyway, and that failure is invisible
in any test that only reads the Decision.

EVERY DENIAL NAMES ITS REASON FROM A CLOSED DOMAIN. A denial reading "not
authorized" tells the owner nothing about what to fix, and a system that cannot
explain its refusals trains people to route around it.

AND THE CONSTANT-LEVEL REFUSAL IS ADVERSARIAL, NOT SHAPE-BASED: the registry
calls the real declared_level with each rule's own example and demands the
answers differ. Counting rules alone would accept a function that declares two
and returns one level -- constant in fact whatever it claims in shape, and
trusted by every call site after registration."""

