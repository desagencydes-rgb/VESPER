##############################################################################
# VESPER CI ENFORCEMENT REGISTRY
#
# Every check declares:
#   name        the check's job name in the workflow
#   enforces    invariant IDs it mechanises
#   kind        process | structural | runtime-fixture
#   impl        the tool that runs it ("PENDING" = specified, not yet written)
#   blocking    the point at which it blocks (pr | release | autonomy-release)
#   self_test   the deliberate violation that MUST be shown failing before the
#               check is trusted. A check that has only ever been green is not
#               evidence. This field is mandatory: CI-043 fails a check that
#               declares no self-test.
#
# Status is tracked in VESPER_ENGINEERING_STATUS.md, not here, so this file
# stays a specification rather than a progress report.
##############################################################################

