self_test_evidence = """tools/ci/self_test.py barge-in-never-swallows-a-halt
-- 3 cases red then green 2026-08-29; 3 more for the long branch 2026-08-30."""
subject = "core/barge_in.py"
note = """Measured need: told to hold the floor while the chooser works, the
system must distinguish "take your time" from "stop". Conversation analysis
already separates COOPERATIVE interruptions, which support the speaker and do
not seek the floor, from COMPETITIVE ones, which take it -- so the taxonomy is
borrowed rather than invented. A third class the obvious design misses is the
liveness check ("you still there?"), which seeks neither; swallowing it
silently is what produces the competitive interruption a moment later."""
discriminators = """THE ASYMMETRY IS THE PROPERTY, NOT THE ACCURACY. A wrong
break-through costs one wasted preparation cycle. A wrong swallow means the
