discriminators = "Token agreement is asserted in BOTH directions. A template token the Swift ignores renders literally into CSS; a Swift substitution for a token the template no longer has means the file was edited and the code was not. Only the first is a visible bug, and the second is the earlier warning -- catching only the first would let the two drift until they broke."

