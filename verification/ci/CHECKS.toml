SR-055's. It unblocks SR-055 by giving Claim.support something a memory-derived
claim can actually carry, and SR-055's own self-check remains unbuilt."""
discriminators = """THE MISQUOTE IS THE CASE A HASH-ONLY RECEIPT WAVES THROUGH.
"Record 412 exists and its body hashes to X" verifies perfectly while the claim
built on it says something the record does not -- a mostly grounded answer
carrying ONE unsupported specific, which is the failure core/evidence.py's own
header names. The quoted text must be FOUND in the resolved record, and found in
