name = "system-turn-reaches-the-wire"
enforces = ["INV-PERSONA-2"]
kind = "structural"
impl = "tools/ci/checks.py system-turn-reaches-the-wire"
blocking = "pr"
self_test = "Drop the system message from the openai_chat branch; drop `instructions` from cf_responses; let the cf_image branch consume `system`; stop the runtime passing a persona to the gateway."
self_test_evidence = "tools/ci/self_test.py system-turn-reaches-the-wire -- 4 cases, red then green, 2026-08-26."
subject = "routing/supply.py x core/gateway.py x tools/ops/vesper_runtime.py"
note = """BUILT-AND-UNREACHED is the failure this exists for, and it is the one this corpus keeps rediscovering -- Provider.profile_id unread, egress applied only at registration, the face connected to nothing. core/persona.py can compose a flawless preamble and, until 2026-08-26, no branch in routing/supply.py had anywhere to put one. Each of the four wires spells it differently and there is no shared field to lean on, so each spelling is asserted by name: a wire added without one carries no persona and looks identical from outside."""
discriminators = "The cf_image branch is asserted in the NEGATIVE direction: an image request has no system role, and folding the preamble into the prompt would render `address the owner as sir` into the picture. The cli_subprocess rung is asserted to fold-and-label rather than to be equivalent -- a prepended preamble is a user turn and can be argued out of by the rest of the same message, which a real system turn resists, and the two rungs must not be silently reported as the same thing."

[checks.CI-071]
name = "latency-preference-reorders"
enforces = ["INV-PERF-2"]
kind = "runtime-fixture"
impl = "tools/ci/checks.py latency-preference-reorders"
blocking = "pr"
self_test = "Make prefer=latency ignore live observations; let it widen eligibility below the tier floor; run the gateway's re-order before quota ranking instead of after; make a demoted rung unforgivable; ignore the enrolment probe's wall clock on a cold profile; let re-registration overwrite a live observation; leave the gateway cold at registration."
self_test_evidence = "tools/ci/self_test.py latency-preference-reorders -- 7 cases, red then green, 2026-08-26."
subject = "core/router.py x core/gateway.py x core/latency.py"
note = """latency_budgets.toml puts speech_end_to_response_onset at 1200 ms. Measured 2026-08-26 the same conversational turn took 25.9 s and 68.7 s, a 20-57x miss, and on_miss.prohibited starts with "relax budget_ms" -- so the implementation was the thing that had to move. Two layers ranked on axes unrelated to time: the router on distance above the tier floor, the gateway on quota headroom. Fixing one moved the variance instead of removing it; four consecutive turns on one profile took 0.56s, 4.22s, 1.02s and 4.63s purely because headroom rotated which of three rungs answered."""
discriminators = "The control that keeps this from becoming `route everything to whatever is quickest` is that the tier FLOOR is asserted to hold under both axes -- prefer=latency chooses among eligible profiles and never widens eligibility, so SR-009 still forbids answering hard work below `strong`. The gateway's re-order is asserted to run strictly AFTER quota ranking, because quota decides which rungs are offered at all and latency may only reorder what it offered. Recovery is asserted on the estimate itself rather than on who won a selection: an assertion about a selection turns on what it was compared against, and the first version of this fixture passed or failed on two near-equal numbers."

[checks.CI-072]
name = "barge-in-never-swallows-a-halt"
enforces = ["INV-HOLD-1"]
kind = "runtime-fixture"
impl = "tools/ci/checks.py barge-in-never-swallows-a-halt"
blocking = "pr"
self_test = """Make a halt swallowable; make a negated halt break; swallow a
liveness check; and over the LONG branch: stop scanning long utterances for halt
words, treat every long utterance as a halt, and ignore the negation guard."""
self_test_evidence = """tools/ci/self_test.py barge-in-never-swallows-a-halt
-- 3 cases red then green 2026-08-29; 3 more for the long branch 2026-08-30."""
subject = "core/barge_in.py"
note = """Measured need: told to hold the floor while the chooser works, the
system must distinguish "take your time" from "stop". Conversation analysis
already separates COOPERATIVE interruptions, which support the speaker and do
not seek the floor, from COMPETITIVE ones, which take it -- so the taxonomy is
borrowed rather than invented. A third class the obvious design misses is the
liveness check ("you still there?"), which seeks neither; swallowing it
silently is what produces the competitive interruption a moment later."""
discriminators = """THE ASYMMETRY IS THE PROPERTY, NOT THE ACCURACY. A wrong
break-through costs one wasted preparation cycle. A wrong swallow means the
owner said "stop" and was ignored. An implementation that is merely accurate,
without that bias, picks the wrong side of every genuinely ambiguous utterance,
and the ambiguity case is the one that fails silently in production. The check
therefore asserts the DEFAULT under ambiguity, not only the labelled cases. It
also asserts no model is reachable from the module: this runs on every inbound
token while the owner waits, and a fixed list is the reason the classifier
cannot be talked out of stopping."""

[checks.CI-073]
name = "baseline-records-what-cannot-be-rebuilt"
enforces = ["INV-BASE-1"]
kind = "runtime-fixture"
impl = "tools/ci/checks.py baseline-records-what-cannot-be-rebuilt"
blocking = "pr"
self_test = """Give `outcome` a default so a caller may omit it; make the
first-turn gap 0.0 instead of None; stop counting a failed append."""
self_test_evidence = """tools/ci/self_test.py baseline-records-what-cannot-be-rebuilt
-- 3 cases, red then green, 2026-08-29."""
subject = "core/baseline.py"
note = """Every question about the memory system is comparative, and none is
answerable without a record of VESPER answering WITHOUT memory. That record is
collectable only before memory is switched on, which is why this landed first."""
discriminators = """OMISSION IS A DIFFERENT TEST FROM A BAD VALUE, and the
first version of this check tested only the second. Giving `outcome` a default
left every value assertion passing while the property that matters -- that a
caller cannot skip the one field nothing can reconstruct -- was gone. The red
run caught it. `declined` and `could_not` are the same event in a log and
nothing downstream separates a choice from a failure afterwards. Similarly the
first-turn gap must be None rather than 0: zero asserts that no time passed,
which is a claim about the world, where None says there was no previous turn,
which is a fact about the record."""

[checks.CI-074]
name = "memory-projects-from-the-log"
enforces = ["INV-EVID-2", "INV-EVID-1"]
kind = "runtime-fixture"
impl = "tools/ci/checks.py memory-projects-from-the-log"
blocking = "pr"
self_test = """Write L2 without the L3 append; make the pointer guard inspect
the pointer's shape instead of resolving it; restore the probe's
`privacy = 'private'` equality; drop the DISTINCT from the reach join; drop the
model_prior refusal."""
self_test_evidence = """tools/ci/self_test.py memory-projects-from-the-log
-- 5 cases, red then green, 2026-08-30."""
subject = "core/memory.py"
note = """L2 is a PROJECTION of L3, never a second primary store. L3 takes the
append and returns a seq; only then may an L2 row exist carrying it. A
graph-first write interrupted between the two leaves a fact with no provenance,
and the surviving row is indistinguishable from a correct one."""
discriminators = """`log_seq INTEGER NOT NULL` IS NOT THIS CHECK, and mistaking
it for one is the whole trap: a 0, a stale seq, or a seq from another store all
satisfy the constraint, because every wrong pointer in this schema is a
well-formed integer. So the check resolves the pointer against L3 rather than
inspecting it, and case 2 mutates the guard into a shape test to prove the
detector can detect.

TWO CASES CAME OUT OF THE MEASURING INSTRUMENT ITSELF, not out of the code.
`tools/spike/l2_query_probe.py` supplied this schema and its query, and carried
both a `privacy = 'private'` predicate -- a benchmark needs a filter of stable
cardinality and any constant serves -- and a `reach` CTE unioned on (id, d),
which returns an entity's facts once per depth that reaches it. Neither was
visible to the probe: `stage_full` counted rows, and a duplicate count reads as
a hit. Carried into the design, the first makes a whole privacy class
permanently unreachable and the second spends block B's 3-5 slots on repeats."""

[checks.CI-076]
name = "updater-refuses-and-ranks"
enforces = ["INV-EVID-1"]
kind = "runtime-fixture"
impl = "tools/ci/checks.py updater-refuses-and-ranks"
blocking = "pr"
self_test = """Remove the credential scan from the capture path; put the raw
text into the tombstone; ignore the off-the-record phrase list; let the
extractor choose its own rank; drop idempotency on the event id; accept an
unnamed miss detector."""
self_test_evidence = """tools/ci/self_test.py updater-refuses-and-ranks
-- 6 cases, red then green, 2026-08-30."""
subject = "core/updater.py"
note = """The updater captures indiscriminately BY DESIGN -- a capture path that
records only what seemed significant has VESPER's blind spots built into it, and
blind spots are what a net is for. That makes the refusal list the entire safety
argument: it is the only thing between a safety net and a file that quietly
accumulates everything said near a microphone."""
discriminators = """INV-EVID-1 IS THE CLAIM, AND IT IS THE NARROW ONE. This
check enforces exactly one invariant -- that a model's reading of an utterance
cannot be stored as the owner's word -- and the other five cases guard
properties that no registered invariant covers. They are tested anyway and
claimed as nothing.

REFUSING IS NOT DELETING, so each refusal is tested for WHERE the material went
and not only for whether it was refused. Without a quarantine an over-refusal is
a silent permanent loss and nobody notices an absence; without a countable
record, a systematically wrong RULE is invisible, because one refusal is an
event and five hundred of the same shape is a pattern.

THE CREDENTIAL CLASS IS THE INVERSION AND IS TESTED TWICE: refused, and its
tombstone checked for the value. Quarantining it in full would gather every
credential VESPER has ever seen into the one store built to be low-security --
a better target than the vault those credentials were taken out of."""

[checks.CI-077]
name = "l1-blocks-hold-index-not-knowledge"
enforces = ["INV-EVID-2"]
kind = "runtime-fixture"
impl = "tools/ci/checks.py l1-blocks-hold-index-not-knowledge"
blocking = "pr"
self_test = """Put the facts into block A instead of the index; add a per-turn
value to block A's front; drop the persona preamble; insert content between
block B and the question; quote block B facts with no pointer."""
self_test_evidence = """tools/ci/self_test.py l1-blocks-hold-index-not-knowledge
-- 5 cases, red then green, 2026-08-30."""
subject = "core/blocks.py"
note = """One block cannot satisfy both constraints. Prefix caching wants stable
content FIRST; long-context attention wants important content at the EDGES,
because the middle degrades by more than 30%. Ordering purely for the cache
buries the facts in the worst position available. A leads, B sits against the
question, and the middle stays empty."""
discriminators = """INV-EVID-2 IS THE ONLY CLAIM. Block B quoting each fact with
its log pointer is the resolvable span the invariant requires; a fact quoted
without one can only be asserted, never cited. The cache and attention
properties this check also guards have no registered invariant, are tested
anyway, and are claimed as covering nothing.

THE CACHE PROPERTY IS TESTED BY COMPARING BYTES, not by reading the code, because
a per-turn value in block A costs full freight on every later turn while the
output looks exactly as it did before. Both directions are asserted: identical
across two turns with unchanged memory, AND different after memory gains a node
-- because a block A that is merely frozen reports an index for a memory that no
longer exists.

ADJACENCY, NOT ORDER, AND THE RED RUN IS WHY. The first version asserted only
that block B led the prompt and the question trailed it. Both remain true while
arbitrary content sits between them, which is exactly the weak middle being
filled. The check now compares the whole prompt against block B and the question
concatenated."""

[checks.CI-078]
name = "arbiter-never-picks-silently"
enforces = ["INV-MEM-1"]
kind = "runtime-fixture"
impl = "tools/ci/checks.py arbiter-never-picks-silently"
blocking = "pr"
self_test = """Take the highest rank instead of asking; stop detecting
contradictions; drop memory_rank in the translation to Claim; make the open
questions unreachable."""
self_test_evidence = """tools/ci/self_test.py arbiter-never-picks-silently
-- 4 cases, red then green, 2026-08-30."""
subject = "core/arbiter.py"
note = """INV-MEM-1 had one enforcer and it was an acceptance test.
`resolve_memory_conflict` has implemented DF-MEMORY-AUTHORITY since A-003 and
was reachable from nothing in the runtime -- called only by run_f1_acceptance.
The arbiter finds contradictions in L2 and hands them to it; it does not
reimplement the ladder, because two rank tables in one corpus would drift and
the one that drifted would be the one nobody was watching."""
discriminators = """THE SILENT PICK IS INVISIBLE BY CONSTRUCTION, which is what
makes it worth a check. Taking the highest rank, the most recent, or the last to
arrive all produce a fluent confident answer and no event; the owner finds out
when the action taken on it turns out wrong, and nothing records that a choice
was made. The first self-test case is exactly that build, and it looks entirely
reasonable in the diff.

AGREEMENT IS TESTED AS HARD AS DISAGREEMENT. Without it, every fact corroborated
by a second source becomes an interruption, the owner learns to dismiss the
questions, and the mechanism is disabled more thoroughly than by never having
been built.

AN ASK CARRYING A VALUE IS ANSWERED. The check asserts both the outcome and the
absence of a value, because every caller downstream will read a value if one is
there and skip the question that came with it.

REACHABILITY IS SEPARATE FROM OUTCOME. A conflict that resolves to ASK and is
then dropped from `open_questions()` reaches the owner exactly as often as a
silent pick does, which is never."""

[checks.CI-079]
name = "forgetter-never-edits-in-place"
enforces = ["INV-LOSS-3"]
kind = "runtime-fixture"
impl = "tools/ci/checks.py forgetter-never-edits-in-place"
blocking = "pr"
self_test = """Do the edit in place; erase with no tombstone; put the erased
value into the tombstone; write the tombstone and skip the row removal; let the
system supersede the owner; make the staleness sweep delete."""
self_test_evidence = """tools/ci/self_test.py forgetter-never-edits-in-place
-- 6 cases, red then green, 2026-08-30."""
subject = "core/forgetter.py"
note = """"Append-only" is about the SYSTEM, not the owner: the system appends,
the owner may supersede or erase. An edit is a NEW record and both remain
readable -- `UPDATE fact SET value = ?` is one line, reads as correct, and
leaves observed_at_hlc claiming a time that belongs to different content, which
makes the audit trail FALSE rather than missing."""
discriminators = """WHAT THIS CHECK DELIBERATELY DOES NOT ASSERT, recorded so it
is not re-added as an oversight. Three index properties were tried:

  `COUNT(*) FROM fact_fts WHERE rowid = ?` is vacuous -- fact_fts is
  external-content, so the lookup resolves through `fact` and reads 0 once the
  base row is gone, cleaned or not.

  A raw `fact_fts MATCH`, and a scan of the `fact_fts_data` shadow blocks, are
  both NON-DETERMINISTIC. Measured 2026-08-30: identical erasures disagreed
  depending only on what else had been written first, because FTS5 segment
  merging decides when a term leaves index storage. A gate that passes for that
  reason is not evidence and would be flaky toward false confidence.

So the searchability assertion is `select()` -- the path every real caller uses,
and the only deterministic one. The residue limit is real and is recorded in
core/forgetter.py rather than gated: erase removes the content from every
logical path into it and cannot promise the bytes are unrecoverable from the
file. A credential that reached L2 should be ROTATED, not merely erased.

THE REDUNDANCY IN erase() IS DELIBERATE. VACUUM alone takes the match count to
zero because it rebuilds the shadow tables as a side effect; the explicit index
delete and rebuild are kept because VACUUM is a maintenance operation, not a
semantic one, and whoever removes it for being slow would take the erasure
guarantee with it."""

[checks.CI-080]
name = "reprojection-never-resurrects"
enforces = ["INV-PRIV-5", "INV-EVID-1"]
kind = "runtime-fixture"
impl = "tools/ci/checks.py reprojection-never-resurrects"
blocking = "pr"
self_test = """Stop consulting the tombstones; project a rank 6 model prior;
take the least private class instead of the most; resolve an unrecognised
privacy class permissively; make verify() always report convergence."""
self_test_evidence = """tools/ci/self_test.py reprojection-never-resurrects
-- 5 cases, red then green, 2026-08-30."""
subject = "core/compactor.py"
note = """L1(n+1) = project(L3), never compact(L1(n)). Compacting the previous
compaction is the natural implementation and it kills four things silently:
generation drift, poisoning, uncorrectable corrections, and unrecoverable bugs.
Re-deriving from a log that CONTAINS the owner's correction just works, with no
special case."""
discriminators = """THE RESURRECTION ARRIVES AS MAINTENANCE, which is what makes
it worth a gate. L3 is append-only -- refused at the storage layer, not by
convention -- so an erased fact's value is still in the log after the owner has
removed it from L2. A projection reading the log alone brings it back during a
routine compaction pass and reports success, and nothing notices because the
result is internally consistent. The projection is a function of the log AND the
tombstones.

THE SURVIVORS ARE ASSERTED AS HARD AS THE ERASURE. A reprojection that drops
everything resurrects nothing and would pass the resurrection test perfectly
while destroying the memory it rebuilt.

DIVERGENCE IS FAILURE MODE 9 AND verify() IS THE ONLY INSTRUMENT FOR IT. Two
nodes both append and both project; if projection is not pure they disagree
while the log agrees, and each node's L2 looks correct from inside. The
self-test makes verify() always return converged, because an instrument that
cannot report a fault is worse than no instrument.

PRIVACY IS RECOMPUTED, NEVER INHERITED, and the mutation takes the minimum
instead of the maximum. That is the aggregation failure arriving as a summary:
three innocuous facts compact into a security profile carrying the least private
of their labels. Monotonic sensitivity subsumes it without needing to detect it
-- you do not have to catch every sensitive thing, you have to never classify
downward."""

[checks.CI-081]
name = "chooser-escalates-only-when-unsure"
enforces = ["INV-DIFF-1"]
kind = "runtime-fixture"
impl = "tools/ci/checks.py chooser-escalates-only-when-unsure"
blocking = "pr"
self_test = """Stop gating escalation on the confidence flag; let a model lower
the difficulty below the floor; use an escalator's answer without checking it is
a difficulty; let a provider failure propagate into the turn; never fire the
hold announcement."""
self_test_evidence = """tools/ci/self_test.py chooser-escalates-only-when-unsure
-- 5 cases, red then green, 2026-08-30."""
subject = "core/chooser.py"
note = """INV-DIFF-1 requires the classification to REPORT whether it was
confident. Until the chooser existed, exactly one thing in this repository read
that flag: the check asserting it was there. A signal nothing consumes can rot
without anyone noticing, and CI-069 would still have been green."""
discriminators = """THE ASYMMETRY HAS TO CROSS THE ESCALATION BOUNDARY OR IT IS
NOT THE ASYMMETRY. CI-069 gates it inside classify(); this gates it at the point
a MODEL's opinion arrives and could quietly undo it. Too high costs a stronger
rung. Too low takes `low` reasoning effort and comes back confidently wrong,
which core/effort.py refuses rather than clamps for the same reason.

THE FIXTURE IS CHECKED FOR AMBIGUITY BEFORE BEING USED AS AN AMBIGUOUS ONE. If
the classifier ever becomes confident about that sentence, the escalation half
of this check would pass by testing nothing -- so the check asserts
`classify(fixture).confident is False` first, and fails loudly rather than
quietly succeeding.

FOUR WAYS THE ESCALATOR CAN FAIL ARE ALL TESTED: raising, returning nonsense,
returning None, and not existing. All four must land on the deterministic
answer, which was already computed before the escalation was attempted. The
chooser is an improvement on the floor and never a dependency of it.

THE 600 ms THRESHOLD IS WHEN TO SPEAK, NOT WHEN TO STOP, so the slow case
asserts BOTH that the announcement fires and that the choice still completes at
the escalated difficulty. A version that cancelled would satisfy the first
assertion alone."""

[checks.CI-082]
name = "sensors-never-reach-a-model"
enforces = ["INV-EVID-3"]
kind = "runtime-fixture"
impl = "tools/ci/checks.py sensors-never-reach-a-model"
blocking = "pr"
self_test = """Remove the decision-path guard from the probe path; poll gated
sources; return a stale value instead of UNKNOWN on failure; write UNKNOWN into
the world model as a value; accept an unrecognised source class."""
self_test_evidence = """tools/ci/self_test.py sensors-never-reach-a-model
-- 5 cases, red then green, 2026-08-30."""
subject = "core/sensors.py"
note = """The trigger predicates were already correct and already evaluating
over an empty world: trigger_registry.toml reads world.owner.attention_state,
world.current_host.health, world.current_host.power_source and
nodes.reachable_set, and nothing populated any of them, so INV-TRIG-4 kept every
one of them from firing. Sensors are the input side, not a new subsystem. One
registry serves both callers -- the verifier is fact->probe->cost->freshness and
a sensor is source->probe->cost->period; two registries would drift and the
scheduled and on-demand readings of one fact would disagree while both looked
right."""
discriminators = """THE MODEL BAN IS ENFORCED AT THE GATEWAY, NOT ASSERTED IN A
COMMENT. Every probe runs inside decision_path.entered, so a probe reaching
ModelGateway.complete is refused there and the attempt is published. This is the
failure decision_path was written for and measured on 2026-08-24: a predicate
closing over a gateway fired True, one model call got through, and zero
violation events were emitted -- the reporting mechanism had been proven and the
path had not. The check therefore asserts the gateway answers NORMALLY outside a
probe first, or the refusal would only prove the fixture is broken.

AND IT IS NOT ONLY COST. A REGEX CANNOT BE PROMPT-INJECTED. Sensors read SMS,
calendar invites, screens and pages found during research -- text an outsider
can put in front of VESPER. A model in the filter makes the filter the
vulnerability it exists to prevent, and "let us just have a small model watch
for interesting things" is the most natural next suggestion anyone will make.

A FAILED PROBE IS UNKNOWN AND IS NOT APPLIED, which is INV-EVID-3 at the world
model: an empty retrieval is never coerced into an answer. Two separate
mutations cover it, because returning a stale value and writing UNKNOWN as a
value are different defects -- the first is unreadable as a failure, the second
makes a broken probe indistinguishable from a fact that legitimately expired.

THE FILTER LOGS WHAT IT DISCARDED. A filter deciding what reaches VESPER is
deciding what VESPER KNOWS, and a filter bug produces SILENCE -- undetectable in
exactly the way a memory miss is."""
