blocking = "pr"
self_test = "Construct an autonomous action with no trigger_id."
self_test_evidence = "tools/ci/self_test.py action-has-trigger -- 1 case, red then green"
subject = "core/autonomy.py"
note = "Scoped by the code's own convention: an autonomy event whose SUBJECT is a trigger must carry trigger_id in its payload, or the durable record cannot be joined back to it. Non-action diagnostics are exempt BY NAME in checks.py and the check fails if a listed exemption stops being emitted, so the list cannot outlive its reason. Payload names resolve within their own function scope and one hop through a helper's returned dict; anything deeper is reported unresolved rather than assumed either way."

[checks.CI-026]
name = "non-schedule-trigger-present"
enforces = ["INV-AUTO-5", "INV-IDEA-5"]
kind = "structural"
impl = "tools/ci/checks.py non-schedule-trigger-present"
blocking = "release"
self_test = "Ship a registry of only SCHEDULE-class predicates (the C1 cron build); replace a predicate BODY with a cron expression while leaving its label non-SCHEDULE; promote a clock term from AND-guard to OR-disjunct; disable rather than remove the backlog trigger; delete a load-bearing STATE row; use a namespace the classification vocabulary does not know; add a row with no source."
self_test_evidence = "tools/ci/self_test.py non-schedule-trigger-present -- 8 cases, red under mutation, green after restore, 2026-08-12."
subject = "contracts/policy/trigger_registry.toml"
note = "The registry is a SHIPPED PRODUCT ARTIFACT, not a fixture. The mandatory source field is what stops this check being satisfied by a filler trigger added to keep CI green. RESIDUAL, stated rather than hidden: a predicate of the form world.<dummy> AND schedule.cron(...) still passes, because deciding whether a state term is load-bearing requires evaluating it against a world model and no evaluator exists before F0. That residue is A-029 behavioural work, not CI-026 work."
defect_corrected = "2026-08-12: this check validated the predicate_class LABEL and never the predicate SEMANTICS. An independent probe replaced the improvement-backlog predicate body with a cron expression, left the label at COMPOSITE, and the check printed 8/8 enabled and non-SCHEDULE and exited 0 -- that build IS the C1 negative control. The declared self-test only ever mutated the label, so the defect was invisible to the harness too: label-only validation, verified by a label-only red run. The predicate body is now parsed into a boolean tree, every namespace root classified against a closed vocabulary, and the predicate evaluated with all clock terms true and all state terms false."

