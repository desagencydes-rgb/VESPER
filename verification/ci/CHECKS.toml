self_test = "Make prefer=latency ignore live observations; let it widen eligibility below the tier floor; run the gateway's re-order before quota ranking instead of after; make a demoted rung unforgivable."
self_test_evidence = "tools/ci/self_test.py latency-preference-reorders -- 4 cases, red then green, 2026-08-26."
subject = "core/router.py x core/gateway.py x core/latency.py"
note = """latency_budgets.toml puts speech_end_to_response_onset at 1200 ms. Measured 2026-08-26 the same conversational turn took 25.9 s and 68.7 s, a 20-57x miss, and on_miss.prohibited starts with "relax budget_ms" -- so the implementation was the thing that had to move. Two layers ranked on axes unrelated to time: the router on distance above the tier floor, the gateway on quota headroom. Fixing one moved the variance instead of removing it; four consecutive turns on one profile took 0.56s, 4.22s, 1.02s and 4.63s purely because headroom rotated which of three rungs answered."""
discriminators = "The control that keeps this from becoming `route everything to whatever is quickest` is that the tier FLOOR is asserted to hold under both axes -- prefer=latency chooses among eligible profiles and never widens eligibility, so SR-009 still forbids answering hard work below `strong`. The gateway's re-order is asserted to run strictly AFTER quota ranking, because quota decides which rungs are offered at all and latency may only reorder what it offered. Recovery is asserted on the estimate itself rather than on who won a selection: an assertion about a selection turns on what it was compared against, and the first version of this fixture passed or failed on two near-equal numbers."
