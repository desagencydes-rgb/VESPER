subject = "core/memory.py"
note = """L2 is a PROJECTION of L3, never a second primary store. L3 takes the
append and returns a seq; only then may an L2 row exist carrying it. A
graph-first write interrupted between the two leaves a fact with no provenance,
and the surviving row is indistinguishable from a correct one."""
discriminators = """`log_seq INTEGER NOT NULL` IS NOT THIS CHECK, and mistaking
it for one is the whole trap: a 0, a stale seq, or a seq from another store all
satisfy the constraint, because every wrong pointer in this schema is a
well-formed integer. So the check resolves the pointer against L3 rather than
inspecting it, and case 2 mutates the guard into a shape test to prove the
detector can detect.

TWO CASES CAME OUT OF THE MEASURING INSTRUMENT ITSELF, not out of the code.
`tools/spike/l2_query_probe.py` supplied this schema and its query, and carried
both a `privacy = 'private'` predicate -- a benchmark needs a filter of stable
