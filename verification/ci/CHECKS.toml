self_test_evidence = "tools/ci/self_test.py adr-gate -- 4 cases: F0 code under an open gate goes RED; record/register divergence goes RED; a status outside the vocabulary goes RED; and the SAME F0 code goes GREEN once ADR-002 is genuinely ACCEPTED. The last case is the discriminating one -- without it the gate would only be shown to dislike files."
subject = "docs/ADR/ADR-001-*.md, ADR-002-*.md, ADR-012-*.md x the core/, tasks/, memory/ trees"
note = "Was PENDING on the ground that it needs git history. It does not. INV-ADR-1 is a property of the TREE, not of a diff: a file existing under a gated path while a required ADR is not ACCEPTED means that file merged under an open gate. Status is read from the ADR RECORD, never from ADR-REGISTER.md -- reading the index would be metadata-only verification. The register is then cross-checked against the records, so a divergence fails in either direction."

