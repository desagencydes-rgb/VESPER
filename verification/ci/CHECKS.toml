`->log:42` beside every fact under a comment saying INV-EVID-2 needs a
resolvable span, and never resolved one. `core/arbiter.py` carried the matching
note from the other side: SourceSpan is a byte range in a FILE, an L2 fact's
provenance is an L3 log SEQUENCE, the two grounding models do not compose, and
manufacturing a path from a seq would yield a citation that looks resolvable and
is not. The stated cost was that `Claim.supported()` was False for every
memory-derived claim, so the arbiter could pick a winner and not cite it.

`LogReceipt` is the log-backed span that note asked for, and `EvidenceResolver`
is the seam that lets both span types coexist: each span asks the resolver for
the half it needs. The alternative was an isinstance ladder in ClaimChecker,
which works for two span types and rots on the third -- and SpanIndex promises a
real retriever "slots in behind the same interface", which a type switch in the
checker quietly revokes.

