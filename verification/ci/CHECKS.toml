empty support as a problem; invert the gated-class test so the gate fires
everywhere except where it matters; stop publishing the refusal; stop counting
claims so the rate has no denominator."""
self_test_evidence = """tools/ci/self_test.py claim-support-required
-- 5 cases, red then green, 2026-08-31."""
subject = "core/evidence.py"
note = """DECLARED WITH THE REGISTRY AND IMPLEMENTED 2026-08-31. ClaimChecker
was written, correct and gated by nothing.

INV-EVID-1 is narrow and absolute: no model_prior claim is emitted as an
assertion in research, memory writes, world facts, or inputs to consequential
actions. Rank 6 is the bottom of REM-010 4.6's total order and is never
authoritative -- a recollection that sounds right is the exact input the ladder
exists to keep out of a decision."""
discriminators = """RANK 6 IS REFUSED EVEN WITH A SPAN THAT RE-READS, and that
case is what separates INV-EVID-1 from a grounding rule. A check that only
exercised unsupported claims would pass against an implementation that had
dropped the rank test entirely, because grounding would catch its fixtures for
the wrong reason.

THE UNIT IS THE CLAIM, NEVER THE RESPONSE. Nine grounded claims must not carry
one invented one -- a mostly-grounded answer containing ONE unsupported specific
is the failure core/evidence.py names in its opening lines, and response-level
judging scores that answer as good because almost all of it is.

THE GATED CLASSES MUST DO WORK IN BOTH DIRECTIONS. A model_prior claim is still
REPORTED as a problem outside them even though it may be emitted there; without
that assertion the rule could be a blanket ban and the policy class would be
decorative.

AND THE RATE IS TRACKED AND PUBLISHED. A-003 makes it a rate rather than
pass/fail because "did this response pass" hides a slow drift upward -- which is
how an evidence gate stops working without ever failing -- and a rate that never
leaves the checker cannot be seen drifting."""

