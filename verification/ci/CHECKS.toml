the same error as a declared throughput under INV-HW-2, which is also why
coverage defaults to null rather than 1.0.

STALENESS IS BY HASH, NOT BY AGE. valid_until schedules the next rebuild; it
does not decide what is true now, and under a time-based rule a file edited one
second after a rebuild reads as fresh for the rest of the window.

AND THE TWO STALENESS GUARDS ARE NOT ONE GUARD, which the first version of this
check could not tell apart: removing the stale filter from retrieve left it
green, because span_for re-hashes at read time and refuses the same node a step
later. The read-time hash is load-bearing; the stale filter exists to avoid
READING a file already known to have moved. The check now asserts that -- a
stale node is neither served nor read."""
