# ---------------------------------------------------------- coordination
[checks.CI-004]
name = "bus-consumer-idempotency"
enforces = ["INV-COORD-5"]
kind = "runtime-fixture"
impl = "tools/ci/checks.py bus-consumer-idempotency"
blocking = "pr"
self_test = """Default the missing key to event_id instead of refusing; re-apply
on replay; skip duplicates without counting them; mark the key seen before the
handler runs; swallow a failing consumer with no audit record."""
self_test_evidence = """tools/ci/self_test.py bus-consumer-idempotency
-- 5 cases, red then green, 2026-08-31."""
subject = "core/bus.py"
note = """DECLARED WITH THE REGISTRY AND IMPLEMENTED 2026-08-31. core/bus.py
took INV-COORD-5's phrase "a build failure" literally and raises on
registration; nothing gated that it kept doing so.

THE KEY IS DEMANDED EXPLICITLY RATHER THAN DEFAULTED TO event_id, and the
difference is the whole point. event_id is the right key only for a consumer
whose unit of work IS one event. One that should deduplicate on a task, a
subject or a command needs a different key, and a silent default would give
every one of them the wrong key while looking correct -- which is why the
defaulting mutation is the first red-run case."""
discriminators = """A-033.2 IS THE PROPERTY THIS BUYS: replaying a stream twice
leaves state byte-identical, with the second pass counted as DUPLICATES rather
than applied. COUNTING matters as much as skipping -- a replay that silently did
nothing is indistinguishable from a replay that never ran -- so suppression and
its counter are separate assertions and separate mutations.

THE KEY IS THE CONSUMER'S, NOT THE BUS'S, and the check proves it by registering
a consumer keyed on SUBJECT and publishing two distinct events for one subject.
It must apply once. Without that assertion the required argument could be
accepted and ignored, and the bus could deduplicate on its own notion of
identity while every test passed.

AND A FAILING CONSUMER IS NOT MARKED SEEN. That is the subtle half: the key is
recorded only after the handler returns, so a handler that raises is retried on
replay. Marking it first turns one crash into permanent, silent data loss for
that consumer -- and the failure is written to the audit store, because a
handler raising since startup otherwise looks exactly like one with nothing to
do."""

[checks.CI-005]
name = "no-wall-clock-ordering"
enforces = ["INV-COORD-4"]
kind = "structural"
impl = "tools/ci/checks.py no-wall-clock-ordering"
note = "Refuses two shapes only: an ordering keyed on a wall-clock timestamp, and a comparison whose BOTH sides are wall-clock timestamps -- the shape of `which record wins`. Asking whether a moment has arrived is neither, and the alarm does exactly that correctly; a check that needed an annotation on every legitimate wall-clock read would be disabled within a week, which is the cost CI-025 already paid. `WALL-CLOCK-OK` allows a use and reports it as a note, so an exception is visible rather than silent."
blocking = "pr"
self_test = "Sort a collection by observed_at_wall without a WALL-CLOCK-OK annotation."
self_test_evidence = "tools/ci/self_test.py no-wall-clock-ordering -- 2 cases, red then green"
subject = "core/"

