enforcement_correction = "2026-08-12: dropped INV-ADR-1. tools/reference_lint.py implements NO merge gate -- it validates that ADR files carry a Status from the correct enum and that cited paths exist. The strings core/, tasks/ and memory/ appear in it only inside a comment. The sole named F0 blocker was therefore defended by one PENDING check and one false claim. INV-ADR-1 is now enforced by CI-008, which is implemented and red-run in both directions."
scope_corrected = "2026-08-12: three blind spots proved by probe, all GREEN before correction. (1) docs/COC/ was excluded wholesale as historical, but v1.1 and the v1.2 additive are LIVE and sit second in the authority hierarchy; both are now scanned and the superseded directory is not. (2) .github/workflows was not scanned at all -- the file naming every tool CI runs was itself unchecked, and a dangling reference there DISABLES enforcement rather than misdescribing it. (3) CODEOWNERS was not scanned. Separately, the linter no longer exempts ITSELF: its probe tokens are assembled from fragments so no literal dangling path appears in the file, and an excluded file inside the scan root is a hole."
