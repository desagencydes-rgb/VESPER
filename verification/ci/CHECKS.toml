enforcement_correction = "2026-08-12: dropped INV-SELF-6. CI-015 is a structural reachability check over runtime WRITE paths; INV-SELF-6 is the merged-commit-to-running-process promotion path, which is CI-017. Added INV-IDEA-3, which INVARIANTS.toml already assigned to this check in the other direction: a backlog idea that matures into a governed change is a runtime write and is caught by the same reachability analysis."

