self_test_evidence = "tools/ci/self_test.py governed-surfaces-integrity -- 5 cases, red then green, 2026-08-12."
defect_corrected = "2026-08-12 (a): the coverage test ran in the WRONG DIRECTION -- it asked whether any declared path started with the required path, so surface 5 single file verification/traceability/registry.toml satisfied the requirement for verification/, and surface 6 could be deleted with this check still GREEN. 2026-08-12 (b): the corrected form used a STRING prefix, so paths = [v, t] satisfied verification/ and tools/ while protecting two directories that do not exist; now a path-COMPONENT prefix. 2026-08-12 (c): extended to require that named load-bearing files are covered by SOME surface, which caught S7 path drift, and that every governed path has a CODEOWNERS line, which caught spec/ being governed by nothing at all."

[checks.CI-044]
name = "governed-surfaces-owner-review"
enforces = ["INV-SELF-2"]
kind = "process"
impl = "PENDING"
blocking = "pr"
self_test = "Modify contracts/policy/governed_surfaces.toml in a commit not owner-reviewed under CODEOWNERS."
note = "Split from CI-016, which validates surface CONTENT, not reviewer identity."
precondition_met = """2026-08-12: the HOST-SIDE precondition is now satisfied. github.com/desagencydes-rgb/VESPER
carries an ACTIVE branch ruleset on the default branch: pull_request required with
required_approving_review_count = 1 AND require_code_owner_review = true; required_status_checks
includes the `gates` context; deletion and non_fast_forward blocked; bypass_actors is EMPTY, so the
rule binds the repository owner too. CODEOWNERS routes all 25 governed paths to the owner account.
Verified by reading the ruleset from the API, not from the setup document.

IMPL REMAINS PENDING, DELIBERATELY. The mechanism now exists; the CHECK does not. Nothing in this
repository yet READS the merge record to assert that a governed-surface change carried an owner
review -- GitHub enforces it at merge time, and CI-044 is the artifact that would VERIFY it was
enforced. Marking this implemented because the platform setting is on would be the CI-022 defect
this corpus was built to catch: a control credited to a check that does not perform it.

What this changes: INV-SELF-2's merge boundary moves from DOCUMENTATION to PLATFORM-ENFORCED. What
it does not change: enforcement is attested by GitHub's configuration rather than by an artifact in
the tree, so a silent change to that configuration is currently invisible here. CI-044 implemented
would close that gap."""

