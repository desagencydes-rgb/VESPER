subject = "core/gateway.py x core/quota.py x routing/http_completion.py x tests/fixtures/provider-responses/google-429-limit-zero.json"
note = """Three properties of one method, checked together because they fail together. Until 2026-08-25 the gateway had a per-provider attempt allowance and no chain-wide bound, so a six-rung ladder cost twelve calls and the price of a request was a property of how many providers happened to be registered. It also called providers in registration order: `profile_id` fixed WHICH CAPABILITY answers and never said which of several providers serving it had quota left. RUNTIME FIXTURE, NOT A GREP, for the reason the module's own docstring records -- `Provider.profile_id` existed from F1 and the gateway never read it, and every test stayed green because A-022 asserted on the RouteDecision and A-004 on attempts_by_class and nothing held the two ends of one call. An import is not a call site. The limit-0 cases parse their quota ceiling out of the CAPTURED bytes with the same function the live path uses, so a cloud session with no credentials is still testing a shape that was observed rather than one it imagined (INV-HW-2)."""
