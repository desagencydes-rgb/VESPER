# ---------------------------------------------------------- cost / period
[checks.CI-020]
name = "gateway-choke-point"
enforces = ["INV-COST-3", "INV-COST-6"]
kind = "runtime-fixture"
impl = "tools/ci/checks.py gateway-choke-point"
blocking = "pr"
self_test = """Permit every class with no policy loaded; remove the
_policy_loaded branch; resolve metered_free_tier as free without a provable cap;
skip the per-provider cost check; stop counting attempts at the boundary."""
self_test_evidence = """tools/ci/self_test.py gateway-choke-point
-- 5 cases, red then green, 2026-08-31."""
subject = "core/gateway.py, core/cost.py"
note = """DECLARED WITH THE REGISTRY AND IMPLEMENTED 2026-08-31.

CARRIED FORWARD FROM THE ORIGINAL ENTRY, because it is the reason this check
owns INV-COST-6 at all: "INV-COST-6 (an unloaded cost policy permits cost_class
free only) was claimed by CI-021, which inspects the policy FILE and therefore
cannot assert anything about the case where that file is absent. Reassigned here
2026-08-12: the gateway is where the default is decided."

INV-COST-6 is what makes ABSENCE safe: a gateway with no loaded cost policy
permits free only. The plausible alternative -- no policy, no restriction --
fails open on exactly the configuration a fresh node, a broken path or a bad
deploy produces, and it fails open in the direction of spending money.

INV-COST-5 is checked alongside it because it is the same failure wearing a
friendlier label: metered_free_tier is PAID unless a hard cap is provable. "The
dashboard says there is a limit" is not provable, and this is the class that
looks free and bills."""
discriminators = """INV-COST-3 IS STRUCTURAL, so behaviour alone cannot
establish it: a second call site that skipped CostPolicy.check would satisfy
every fixture and violate the invariant. The check therefore scans the source
for provider invocations and requires all of them to be inside the gateway.

THAT SCAN WAS VACUOUS IN ITS FIRST VERSION -- it looked for `.invoke(`, which
appears nowhere in this codebase, so it could never have found anything. It now
looks for `<name>.call(`, the shape that exists (gateway.py:850), and asserts
that it finds at least one site, or a blind scan passes as a clean one. Its
limit is stated in the code: an adapter stored in a dict and invoked as
`adapters[k](...)` would not be found, and no scan short of type inference would
find it.

THE COST CHECK IS PER PROVIDER, NOT PER REQUEST. A chain walks several rungs, so
checking the first and descending would authorise every rung below it on the
strength of the cheapest one -- the check reads the source to confirm the call
sits inside the loop.

AND THE NO-POLICY GUARANTEE HAS TWO MECHANISMS THAT ARE NOT ONE. The lookup's
own default is already free-only, so with an empty permitted map the explicit
`_policy_loaded` branch is redundant and removing it left the check green. What
that branch guarantees is free-only REGARDLESS of what the map contains -- a
policy file that parsed far enough to populate entries without being considered
loaded. The check now populates the map and asserts the branch still holds.

A POSITIVE CASE GUARDS THE REST: a FREE provider must still answer and be
counted at the boundary, or the gateway is refusing everything and the
paid-refusal assertion passes for the wrong reason."""

