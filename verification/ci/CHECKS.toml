THE RECEIPT QUOTES THE L2 VALUE AND RESOLVES AGAINST THE L3 RECORD. Those are
written by different code paths, so a receipt whose quoted value is absent from
the record it names is memory that has drifted from its own log. A receipt built
from the record alone would agree with itself and detect nothing -- which is a
mutation here, because it is the version that looks tidier.

WHAT VERIFICATION CATCHES DEPENDS ON THE STORE, and the accounting matters or a
case gets written that can never fire. `log`, `audit` and `tombstones` are
append-only at the storage layer -- UPDATE and DELETE refused by trigger -- so a
body there cannot change under a correct citation and the hash comparison can
never go red on tampering. What fires on those paths is a fabricated seq, a seq
into the wrong kind, and a quote absent from the record. In `state` and
