##############################################################################
# VESPER TRACEABILITY REGISTRY
#
# Purpose: the single machine-checkable mapping that repairs the verification
# axis. It replaces COC Part XI, which is a bundle-join whose Verification
# column holds one identical placeholder string in 51/51 rows.
#
# This file does NOT define which identifiers exist. The locked COC does, and
# tools/vesper_ids.py extracts them. This file defines only the MAPPINGS:
#
#   SOURCE -> SR -> ARCHITECTURE -> MECHANISM
#          -> CONTRACT / SCHEMA / STATE MACHINE / DECISION FUNCTION
#          -> ACCEPTANCE TEST -> CI ENFORCEMENT
#
# Enforced by tools/traceability_lint.py (CI check CI-003).
#
# Authority: this registry is a DERIVED engineering artifact. It may not add,
# remove, weaken, or reinterpret any SR. Where it records a gap, the gap is
# recorded -- never closed by assertion.
#
# Status vocabulary (extends Foundation "Traceability & Release Gate"):
#   UNMAPPED        no architecture/contract/test mapping yet
#   DESIGNED        architecture mapping exists; no contract yet
#   CONTRACTED      contract/schema/state machine/decision function exists
#   SPECIFIED       + named acceptance test specification exists
#   IMPLEMENTED     code exists (not reachable before the readiness gate)
#   VERIFIED        acceptance test executes and passes on target hardware
#   ACCEPTED        owner-accepted for a release
#   R_AND_D         COC Part XIV.3 limitation record + R&D path; never
#                   reportable as IMPLEMENTED
#   PARTIAL_R_AND_D part core+buildable, part Part XIV.3 limitation
##############################################################################

schema_version = 1
authority = "docs/COC/VESPER_V0_DEFINITIVE_COC_AND_RULEBOOK_v1.1.md"
supersedes = "COC Part XI (traceability matrix), COC Part XV (verification-axis PASS lines)"
last_updated = "2026-08-11"

# --------------------------------------------------------------------------
# Architecture sections that are deliberately NOT requirement-bearing.
# Every other ARCH-xx must be referenced by >= 1 SR or the linter fails.
# --------------------------------------------------------------------------
[non_requirement_bearing]
ARCH-26 = "Development and Release Strategy -- process guidance, not system behaviour. Governed by docs/baseline/ and verification/ci/."
ARCH-27 = "Definition of Done -- acceptance policy, not system behaviour. Discharged by this registry plus verification/acceptance/."

